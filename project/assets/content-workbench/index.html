<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>内容白板 · DashiAI</title><link rel="stylesheet" href="/style.css"></head><body>
<header><div><span class="brand">DashiAI</span><span class="app-name">内容策划白板</span><span class="stage-label">① 明确汇报需求 → ② 白板确认 → ③ 整套视觉策划与导出</span></div><div class="toolbar"><span id="save-state">读取中</span><button id="brief">汇报需求</button><button id="save">保存</button><button id="undo">撤销</button><button id="redo">重做</button><button id="pause-all">暂停</button><button id="cancel-all">取消进行中操作</button><button id="history">版本</button><button id="settings">模型 / Agent</button></div></header>
<div id="notice" role="status" hidden></div><main>
<aside class="outline"><div class="pane-head"><h1 id="project-title">内容目录</h1><button id="add-slide" title="新增页面">＋</button></div><div id="progress"></div><div class="progress-bar"><i id="progress-bar"></i></div><nav id="slides" aria-label="页面目录"></nav><div class="outline-foot">拖动缩略页调整顺序<br><br>原作：大师的AI小灶<br>魔改迭代：靳晓楠00491162</div></aside>
<section class="workspace"><div id="paused-banner" class="paused-banner" hidden>工作台已暂停。未完成的编辑已保留；继续后可接着操作。</div><div class="board-toolbar"><div><span id="slide-number"></span><span id="slide-state" class="badge"></span></div><div><select id="board-mode" aria-label="页面逻辑编排"><option value="columns">并列观点</option><option value="flow">流程 / 因果链</option><option value="comparison">对比排布</option><option value="hierarchy">上下支撑</option><option value="free">自由排布</option><option value="title">封面 / 章节</option></select><button id="arrange">重新排布</button><button id="connect">连线</button><label><input type="checkbox" id="grid">网格</label><label><input type="checkbox" id="snap" checked>吸附</label></div></div>
<div class="board-viewport" id="board-viewport"><div class="board" id="board" role="region" aria-label="16比9内容策划白板"></div></div>
<div class="workspace-footer"><div><button id="add-block" class="primary">＋ 内容块</button><button id="duplicate-block">复制块</button><button id="delete-block" class="danger">删除块</button><button id="original">最初稿</button></div><div><button id="move-up">页上移</button><button id="move-down">页下移</button><button id="duplicate-slide">复制页</button><button id="delete-slide">删页</button><button id="confirm-slide">确认本页</button></div></div>
<div class="board-hint">单击内容块查看 / 修改；拖动块体调整位置，右下角调整尺寸；双击直接编辑。连线可表达支撑、因果与顺序。Esc 取消当前拖动或编辑。白板表达策划关系，最终页面继续由 Theme17 模板排版。</div><div id="activity" aria-live="polite"></div>
</section>
<aside class="side-panel"><section class="side-section"><h2 id="inspector-title">内容块</h2><div id="inspector"><div class="inspector-placeholder">点击白板上的标题、结论或内容块，即可查看和编辑。</div></div></section>
<section class="side-section"><h2>AI 协同修改</h2><label>修改范围<select id="scope"><option value="selection">选中块 / 所选文字</option><option value="slide">当前整页</option><option value="deck">整套结构（先预览）</option></select></label><div id="selection-info" class="scope-info">先点击要修改的内容块。</div><label>调用方式<select id="ai-mode"><option value="bridge">Agent 桥接（自动执行）</option><option value="provider">模型服务</option><option value="manual">外部 Agent 手动桥接</option></select></label><label class="check"><input id="auto-apply" type="checkbox" checked>校验通过后直接更新当前白板</label><label class="check"><input id="protect-numbers" type="checkbox" checked>保护原有数字</label><div id="conversation"></div><label>修改要求<textarea id="prompt" rows="3" placeholder="例如：突出这块的核心判断，表述再简练一点。"></textarea></label><button id="ask-ai" class="primary wide">AI 修改</button><div id="ai-state" class="task-info"></div><div id="ai-controls"></div><div id="proposal-actions" hidden><button id="view-proposal" class="wide">查看修改前后</button><div class="proposal-actions"><button id="reject">拒绝</button><button id="accept" class="primary">接受提案</button></div></div></section>
<section class="side-section generate-section"><div id="generation-state"></div><button id="compile-check" class="wide">检查编排容量</button><button id="confirm-all" class="wide">确认整套内容</button><button id="generate" class="primary wide" disabled>生成 PPT</button><a id="preview-link" class="preview-link" target="_blank" rel="noopener" hidden>打开 PPT 预览 / 编辑 / 导出 ↗</a></section></aside></main>
<dialog id="modal"><div class="modal-head"><h2 id="modal-title"></h2><button id="close-modal">关闭</button></div><div id="modal-body" class="modal-body"></div></dialog><script type="module" src="/app.js"></script></body></html>
