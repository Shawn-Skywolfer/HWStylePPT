<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>DashiAI · 内容思维导图</title><link rel="stylesheet" href="/style.css"></head><body>
<header><div class="identity"><strong>DashiAI</strong><span>内容思维导图</span><small>① Agent 对话明确需求 → ② 脑图审稿与微调 → ③ 全篇视觉策划与 PPT</small></div><div class="top-actions"><span id="save-state">读取中</span><button id="brief">汇报需求</button><button id="save" class="primary">保存草稿</button><button id="undo" title="Ctrl / Cmd + Z">撤销</button><button id="redo" title="Ctrl / Cmd + Shift + Z">重做</button><button id="markdown">Markdown</button><button id="export">导出</button><button id="history">版本</button><button id="settings">模型 / Agent</button></div></header>
<div id="notice" role="status" hidden><span id="notice-message"></span><button id="notice-details" hidden>查看详情</button><button id="notice-close" aria-label="关闭提示" title="关闭提示，记录仍保留在诊断控制台">×</button></div>
<main><aside class="outline"><div class="outline-title"><strong id="project-title"></strong><button id="add-slide" title="新增页面">＋</button></div><div id="progress" class="muted"></div><label class="search-box"><input id="search" type="search" placeholder="搜索节点  Ctrl+F" aria-label="搜索节点"></label><div id="search-results" hidden></div><nav id="slides" aria-label="页面导航"></nav><div class="outline-footer"><button id="shortcuts">快捷键与操作帮助</button><p>原作：大师的AI小灶<br>魔改迭代：靳晓楠00491162</p></div></aside>
<section class="workspace"><div class="map-toolbar"><div><button id="add-child" title="Tab">＋ 子主题</button><button id="add-sibling" title="Enter">＋ 同级</button><button id="add-field">＋ 字段</button><button id="rename" title="F2">编辑</button><button id="duplicate">复制</button><button id="delete" class="danger">删除</button></div><div><button id="zoom-out" aria-label="缩小">−</button><button id="zoom-reset">100%</button><button id="zoom-in" aria-label="放大">＋</button><button id="fit">适应画布</button><button id="focus">聚焦分支</button><button id="all">全图</button></div></div>
<div class="map-breadcrumb"><span id="breadcrumb">中心主题</span><span>双击 / F2 编辑 · Tab 子主题 · Enter 同级 · 拖动节点调整结构</span></div>
<div id="map-viewport" tabindex="0" role="region" aria-label="向右展开的内容思维导图"><div id="map-world"><svg id="map-lines" aria-hidden="true"></svg><div id="map-nodes" role="tree" aria-label="内容节点"></div></div><div id="map-empty" hidden>没有匹配的节点</div></div>
<div class="workspace-status"><span id="selection-status">选择节点查看完整内容</span><div><button id="pause-all">暂停任务</button><button id="cancel-all">取消进行中任务</button><button id="collapse-all">折叠分支</button><button id="expand-all">展开全部</button></div></div><div id="activity" aria-live="polite"></div></section>
<aside class="inspector"><section class="panel"><div class="panel-heading"><h2 id="inspector-title">节点</h2><span id="node-kind" class="badge"></span></div><div id="editor"></div></section>
<section class="panel"><h2>AI 协同修改</h2><div id="selection-info" class="scope-info"></div><label>修改范围<select id="scope"><option value="node">当前节点</option><option value="slide">当前页面</option><option value="deck">整套结构（先预览）</option></select></label><label>执行方式<select id="ai-mode"><option value="bridge">Agent 桥接（自动执行）</option><option value="provider">模型服务</option><option value="manual">外部 Agent 手动桥接</option></select></label><label class="check"><input type="checkbox" id="auto-apply" checked>校验后更新当前脑图</label><label class="check"><input type="checkbox" id="protect-numbers" checked>保护原有数字</label><textarea id="prompt" rows="3" placeholder="例如：突出这个论点，保留证据与数据。"></textarea><button id="ask-ai" class="primary wide">AI 修改</button><div id="ai-state" class="task-info"></div><div id="ai-controls"></div><div id="proposal-actions" hidden><button id="view-proposal">预览修改</button><button id="reject">拒绝</button><button id="accept" class="primary">接受</button></div></section>
<section class="panel generate-panel"><div id="generation-state"></div><button id="compile-check" class="wide">检查全篇内容与版式</button><button id="confirm-page" class="wide">确认当前页</button><button id="confirm-all" class="wide">确认整套内容</button><button id="generate" class="primary wide" disabled>生成 PPT</button><a id="preview-link" target="_blank" rel="noopener" hidden>打开 PPT 预览 / 编辑 / 导出 ↗</a></section></aside></main>
<div id="context-menu" hidden role="menu"></div><dialog id="modal"><div class="modal-head"><h2 id="modal-title"></h2><button id="close-modal">关闭</button></div><div id="modal-body"></div></dialog>
<dialog id="diagnostics-dialog" aria-labelledby="diagnostics-title"><div class="modal-head"><h2 id="diagnostics-title">诊断控制台</h2><button id="diagnostics-close">关闭</button></div><div class="diagnostics-toolbar"><label>记录<select id="diagnostics-filter"><option value="open">待处理</option><option value="all">全部</option><option value="resolved">已处理</option></select></label><button id="diagnostics-export">导出诊断记录</button><button id="diagnostics-clear">清理已处理记录</button></div><div class="diagnostics-grid"><nav id="diagnostics-list" aria-label="问题记录"></nav><section><div id="diagnostics-detail"></div><div id="repair-panel" hidden></div></section></div></dialog>
<script type="module" src="/app.js"></script></body></html>
