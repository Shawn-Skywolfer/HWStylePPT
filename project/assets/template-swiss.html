  let savedLanguage = null;
  try { savedLanguage = localStorage.getItem(LANG_KEY); } catch (err) { /* private mode 等 */ }
  if(savedLanguage === 'zh' || savedLanguage === 'en'){
    language = savedLanguage;
  } else {
    const systemLanguage = String(navigator.language || '').toLowerCase();
    if(systemLanguage.startsWith('zh')) language = 'zh';

    'PDF 导出失败，请在浏览器控制台查看错误。': 'PDF export failed. Check the browser console for details.',
    '提交截图 PDF 生成任务...': 'Submitting PDF render job...',
    '提交可编辑 PPTX 生成任务...': 'Submitting editable PPTX job...',

    // Export guide modal
    '已复制': 'Copied',
    '复制失败': 'Copy failed',

    '发送给 AI,启动预览服务:': 'Send to your AI to start the preview service:',

    '这个地址后面没有可用的导出服务(可能是一个纯静态文件服务器,或预览服务已退出)。把下面的提示词发给 AI,让它用 DashiAI PPT 自带的预览服务重新启动:': 'No export service is available at this address (it may be a plain static file server, or the preview service has exited). Send the prompt below to your AI so it restarts the deck with the DashiAI PPT preview service:',
    '发送给 AI,重启预览服务:': 'Send to your AI to restart the preview service:',
    '帮我用 dashiai-ppt 的预览服务重新启动这个 PPT 的预览': 'Please restart the preview of this deck with the dashiai-ppt preview service',
    '也可以直接跟 AI 说:': 'Or simply tell your AI:',
    '帮我导出PPTX': 'Help me export the PPTX',
    '手动方式:在终端运行 npm --prefix <skill-root>/project run preview:start -- <输出 ppt 目录> <port>,再用它输出的 http://127.0.0.1:<port>/ 打开导出。': 'Manual option: run npm --prefix <skill-root>/project run preview:start -- <output ppt dir> <port> in a terminal, then open the printed http://127.0.0.1:<port>/ and export from there.',
  };

  // 导出进度 detail 来自导出引擎(vendor bundle / 服务端接口)的中文文案,
  // 按已知模式在显示层转英文;未匹配模式原样透出(中文兜底)。
  const EXPORT_DETAIL_EN = [
    [/^应用页面编辑状态$/, 'Applying page edits'],
    [/^生成 PPTX 文件$/, 'Generating PPTX file'],
    [/^保存 PPTX 文件$/, 'Saving PPTX file'],
    [/^采集页面结构 (\d+)\/(\d+)$/, 'Collecting page structure $1/$2'],
    [/^采集页面结构$/, 'Collecting page structure'],
    [/^生成 PPTX 对象 (\d+)\/(\d+)$/, 'Building PPTX objects $1/$2'],
    [/^服务端接收 PDF 导出请求$/, 'Server received PDF export request'],
    [/^服务端接收导出请求$/, 'Server received export request'],
    [/^启动截图浏览器$/, 'Launching screenshot browser'],
    [/^准备下载文件$/, 'Preparing file download'],
    [/^准备浏览器下载$/, 'Preparing browser download'],
    [/^打开预览页面$/, 'Opening preview page'],
    [/^准备导出页面状态$/, 'Preparing page state for export'],
    [/^等待服务端进度$/, 'Waiting for server progress'],
    [/^截图批次 (\d+)\/(\d+)$/, 'Screenshot batch $1/$2'],
    [/^截取第 (\d+)\/(\d+) 页$/, 'Capturing slide $1/$2'],
    [/^正在生成可编辑 PPTX$/, 'Generating editable PPTX'],
  ];
  function exportDetail(detail){
    const text = typeof detail === 'string' ? detail.trim() : '';
    if(!isEn || !text) return detail;
    for(const [pattern, replacement] of EXPORT_DETAIL_EN){
      if(pattern.test(text)) return text.replace(pattern, replacement);
    }
    return detail;
  }

  const isEn = language === 'en';
  function meta(value){
    if(!isEn || typeof value !== 'string' || !value) return value;
    return metaDict[value] || metaDict[value.trim()] || value;
  }
  function ui(text, params){
    let out = text;
    if(isEn && typeof text === 'string' && UI_STRINGS_EN[text]) out = UI_STRINGS_EN[text];
    if(params && typeof out === 'string'){
      out = out.replace(/\{(\w+)\}/g, (match, key) => (key in params ? String(params[key]) : match));
    }
    return out;
  }

  // 静态 DOM 文案批量翻译:文本节点 + title/aria-label/placeholder/alt。
  // 只在 en 下启动时跑一次,词典覆盖即生效,静态 HTML 无需逐处改动。
  const STATIC_ATTRS = ['title', 'aria-label', 'placeholder', 'alt', 'data-color-label'];
  function translateStaticDom(root){
    if(!isEn || !root) return;
    const walker = document.createTreeWalker(root, NodeFilter.SHOW_TEXT);
    const textNodes = [];
    while(walker.nextNode()) textNodes.push(walker.currentNode);
    textNodes.forEach(node => {
      if(node.parentElement?.closest('#deck,#slide-rail-list,#preview-lang-toggle,pre,textarea,[contenteditable=true],[data-i18n-ignore]')) return;
      const raw = node.nodeValue;
      const trimmed = raw?.trim();
      if(!trimmed || !UI_STRINGS_EN[trimmed]) return;
      node.nodeValue = raw.replace(trimmed, UI_STRINGS_EN[trimmed]);
    });
    const all = [root, ...root.querySelectorAll('*')];
    all.forEach(el => {
      if(!el.getAttribute) return;
      if(el.closest('#deck,#slide-rail-list,#preview-lang-toggle,pre,textarea,[contenteditable=true],[data-i18n-ignore]')) return;
      STATIC_ATTRS.forEach(attr => {
        const value = el.getAttribute(attr);
        if(value && UI_STRINGS_EN[value.trim()]) el.setAttribute(attr, UI_STRINGS_EN[value.trim()]);
      });
    });
  }

  window.__deckI18n = { language, isEn, meta, ui, exportDetail, setLanguage, translateStaticDom, uiStrings: UI_STRINGS_EN };

  if(isEn){
    const run = () => translateStaticDom(document.body);
    document.readyState === 'loading'
      ? document.addEventListener('DOMContentLoaded', run, { once: true })
      : run();
  }
  // html lang 跟随运行时语言(SSR 写入的初始值可能与运行时决定不一致)。
  document.documentElement.setAttribute('lang', isEn ? 'en' : 'zh-CN');
})();

    const out = {};

    });

  function isOmittedAuthoredProp(value){
    return value === OMIT_AUTHORED_PROP;

    return PRIVATE_NESTED_PROP_KEYS.has(String(key || ''));
  }

  function getComponentDefaultSlideProps(slideId){
    const slideEl = [...document.querySelectorAll('#deck > .slide')].find(slide => slide.dataset.vmSlideId === slideId);
    return readDatasetJson(slideEl?.querySelector('[data-prop-controls]')?.dataset.propDefaults, {});

  function getSlideSourceProps(slideId){

  }

  function normalizeRestoredProps(props){
    const out = {};
    Object.entries(props || {}).forEach(([slideId, rawValues]) => {

  function normalizeRestoredSlideProps(slideId, rawValues){

  }

  function resolveRestoredRangeBounds(control, values){
    const min = Number(control.min ?? 0);
    let max = Number(control.max ?? 10);
    if(control.maxFromKey && RESTORED_EMPHASIS_INDEX_KEYS.has(control.key)){

        const offset = Number.isFinite(explicitOffset) ? explicitOffset : (min === 0 ? -1 : 0);
        max = Math.min(max, Math.max(min, linkedValue + offset));
      }
    }
    if(max < min) max = min;
    return {min, max};
  }

  function normalizeRestoredControlType(type){
    if(['slider', 'range', 'number'].includes(type)) return 'range';
    return type || 'range';
  }

  function getSlidePropControls(slideId){
    const slideEl = [...document.querySelectorAll('#deck > .slide')].find(slide => slide.dataset.vmSlideId === slideId);
    return readDatasetJson(slideEl?.querySelector('[data-prop-controls]')?.dataset.propControls, []);
  }

  function hasOwn(object, key){
    return Object.prototype.hasOwnProperty.call(object || {}, key);
  }

  function readDatasetJson(value, fallback){
    try {
      return JSON.parse(value || '') || fallback;
    } catch {
      return fallback;
    }
  }

  function uniqueIds(ids){
    return [...new Set((ids || []).filter(Boolean).map(String))];
  }

  function readJson(el, fallback){
    if(!el) return fallback;
    try {
      return JSON.parse(el.textContent || '') || fallback;
    } catch {
      return fallback;
    }
  }

  function writeJson(el, data){
    if(el) el.textContent = JSON.stringify(data || {}).replace(/</g, '\\u003c');
  }

  function createDeckSignature(model, text){
    const payload = JSON.stringify({
      title: model.title,
      exportId: model.exportId || '',
      slides: (model.slides || []).map(slide => [slide.id, slide.key, slide.layout, slide.dataLayout, slide.props]),
      text,
    });
    let hash = 0;
    for(let i = 0; i < payload.length; i += 1){
      hash = ((hash << 5) - hash + payload.charCodeAt(i)) | 0;
    }
    return String(hash);
  }
})();

function getSlideVmId(slide, index){
  // indexOf 是 O(N),必须惰性:正常页都有 vmSlideId,不该为它付全表扫描(1020 卡遍历时会是 O(N²))。

    || `slide-${Math.max(0, index ?? allSlides.indexOf(slide)) + 1}`;
}

let svgCloneIdCounter = 0;
function uniquifySvgCloneIds(root, label='clone'){
  if(!root?.querySelectorAll) return root;
  const idNodes = [...root.querySelectorAll('svg [id]')];
  if(root.matches?.('svg [id]')) idNodes.unshift(root);
  if(!idNodes.length) return root;
  const suffix = `${label}-${Date.now().toString(36)}-${(svgCloneIdCounter++).toString(36)}`;
  const idMap = new Map();
  idNodes.forEach((node, index) => {
    const id = node.id;
    if(!id || idMap.has(id)) return;
    const next = `${id}__${suffix}-${index}`;
    idMap.set(id, next);
    node.id = next;
  });
  if(!idMap.size) return root;
  const rewriteSvgUrlRefs = value => String(value || '').replace(/url\((["']?)#([^"')]+)\1\)/g, (match, quote, id) => {
    const mapped = idMap.get(id);
    return mapped ? `url(${quote}#${mapped}${quote})` : match;
  });
  const refNodes = [root, ...root.querySelectorAll('*')];
  refNodes.forEach(node => {
    if(!node.attributes) return;
    [...node.attributes].forEach(attr => {
      let value = attr.value;
      if(!value) return;
      let next = rewriteSvgUrlRefs(value);
      if((attr.name === 'href' || attr.name === 'xlink:href') && next.startsWith('#')){
        const mapped = idMap.get(next.slice(1));
        if(mapped) next = `#${mapped}`;
      }
      if(next !== value) node.setAttribute(attr.name, next);
    });
  });
  root.querySelectorAll?.('style').forEach(node => {
    const value = node.textContent || '';
    const next = rewriteSvgUrlRefs(value);
    if(next !== value) node.textContent = next;
  });
  return root;
}

function releaseTemplateVideoElements(root){
  const videos = [];
  const visit = node => {
    if(!node) return;
    if(node.matches?.('video')) videos.push(node);
    node.querySelectorAll?.('video')?.forEach(video => videos.push(video));
    node.querySelectorAll?.('*')?.forEach(el => {
      if(el.shadowRoot) visit(el.shadowRoot);
    });
  };
  visit(root);
  videos.forEach(video => {
    video.pause?.();
    if(video.getAttribute?.('src')) video.removeAttribute('src');
    video.querySelectorAll?.('source[src]')?.forEach(source => source.removeAttribute('src'));
    video.load?.();
  });
}

function isDuplicatedRuntimeSlide(slide){

function uniquifyDuplicatedRuntimeSlideSvgIds(slide){

function restorePersistedCatalogSlides(){
  const state = window.__deckViewModel?.getState?.() || {};

  if(!records.length) return;
  const slideById = new Map(collectDeckSlides().map((slide, index) => [getSlideVmId(slide, index), slide]));
  records.forEach(record => {
    if(!record?.sourceId || !record?.copyId || slideById.has(record.copyId)) return;
    const source = slideById.get(record.sourceId);
    if(!source) return;
    const clone = source.cloneNode(true);
    releaseTemplateVideoElements(clone);
    uniquifySvgCloneIds(clone, 'duplicated-slide');
    prepareDuplicatedSlideClone(clone, source, record.copyId);

    slideById.set(record.copyId, clone);

const slideStateSetCache = new Map();
function getSlideStateSet(key){

  if(cached && cached.source === source) return cached.set;
  const set = new Set(list.filter(Boolean).map(String));
  slideStateSetCache.set(key, { source, set });

function isSlideSkipped(slide, index=allSlides.indexOf(slide)){

function refreshSlideList(){

  const deleted = getSlideStateSet('deletedSlides');
  allSlides.forEach((slide, index) => {
    const slideId = getSlideVmId(slide, index);
    const hiddenByPack = isSlideHiddenByThemePack(slide);
    const hiddenByState = deleted.has(slideId) || skipped.has(slideId);
    const hidden = hiddenByPack || hiddenByState;
    slide.hidden = hidden;
    if(skipped.has(slideId)) slide.dataset.slideSkipped = 'true';
    else delete slide.dataset.slideSkipped;
    if(hidden) slide.setAttribute('aria-hidden', 'true');
    else slide.removeAttribute('aria-hidden');
  });

function parseRuntimeSlidePage(layout){
  const match = String(layout || '').match(/^(theme\d+)_page(\d+)$/i);
  return match ? Number(match[2]) : null;
}

function getRuntimeSlideErrorMeta(slide){
  const root = slide?.querySelector?.('.imported-theme-root');
  const layout = slide?.dataset?.vmLayout || root?.dataset?.pageKey || '';
  const index = Number(slide?.dataset?.vmIndex);
  return {
    theme: slide?.dataset?.themePack || root?.dataset?.themeKey || activeThemePack || document.documentElement.dataset.themePack || 'unknown',
    page: parseRuntimeSlidePage(layout) ?? (Number.isFinite(index) ? index + 1 : null),
    layout: layout || 'unknown',
    dataLayout: slide?.dataset?.layout || '',

  };
}

function reportRuntimeSlideError(context, slide, error){
  const meta = getRuntimeSlideErrorMeta(slide);
  const message = error?.message || String(error || 'runtime render failed');
  const detail = {...meta, context, message};
  window.__deckRuntimeErrors = window.__deckRuntimeErrors || [];
  window.__deckRuntimeErrors.push(detail);
  console.error(`[${context}] theme=${meta.theme} page=${meta.page == null ? 'unknown' : String(meta.page).padStart(3, '0')} layout=${meta.layout} ${message}`, error);
  dispatchEvent(new CustomEvent('deck-runtime-error', {detail}));
}

function isRuntimeThemeSlide(slide){
  return !!slide?.querySelector?.('.imported-theme-root');
}

function showRuntimeSlideErrorPlaceholder(slide, error){
  if(!slide) return;
  let overlay = slide.querySelector(':scope > [data-runtime-error-overlay]');
  if(!overlay){
    overlay = document.createElement('div');
    overlay.setAttribute('data-runtime-error-overlay', 'true');
    overlay.style.cssText = 'position:absolute;inset:0;z-index:80;display:flex;flex-direction:column;'
      + 'align-items:center;justify-content:center;gap:10px;padding:48px;text-align:center;'
      + 'background:rgba(17,17,20,0.94);color:#fff;font:600 22px/1.4 var(--sans,sans-serif);pointer-events:none;';
    const title = document.createElement('div');
    title.textContent = window.__deckI18n.ui('该页渲染失败，内容已跳过');
    const detail = document.createElement('div');
    detail.style.cssText = 'font-weight:400;font-size:14px;opacity:.7;max-width:82%;word-break:break-word;';
    overlay.append(title, detail);
    slide.appendChild(overlay);
  }
  const detailEl = overlay.lastElementChild;
  if(detailEl) detailEl.textContent = error?.message ? String(error.message).slice(0, 240) : '';
}

function clearRuntimeSlideErrorPlaceholder(slide){
  slide?.querySelector?.(':scope > [data-runtime-error-overlay]')?.remove();
}

// isolated:true 的调用方(如 go()/commitSlideIndex)在这次调用之后还有收尾代码要跑(释放
// 导航锁等)——异常在这里必须被兜住,不能冲断收尾代码。非 isolated 调用方(如 overview 缩略图
// 生成管线的 renderOverviewThumb)自己有更专用的外层 try/catch 和恢复 UI,这里必须让异常正常
// 往外传,不能抢先吞掉,否则外层那套上下文更准确的错误处理和占位 UI 就都不会触发了。
function renderRuntimeSlideWithIsolation(slide, props, opts={}){
  if(!opts.isolated){
    const rendered = !!window.__renderRuntimeSlide?.(slide, props);
    delete slide.dataset.runtimeRenderError;
    clearRuntimeSlideErrorPlaceholder(slide);
    return rendered;
  }
  let rendered = false;
  let thrown = null;
  try{
    rendered = !!window.__renderRuntimeSlide?.(slide, props);
  }catch(error){
    thrown = error;
  }
  if(rendered){
    delete slide.dataset.runtimeRenderError;
    clearRuntimeSlideErrorPlaceholder(slide);
    return true;
  }
  if(thrown) reportRuntimeSlideError(opts.context || 'runtime isolated render', slide, thrown);
  if(isRuntimeThemeSlide(slide)){
    slide.dataset.runtimeRenderError = 'true';
    showRuntimeSlideErrorPlaceholder(slide, thrown);
  }
  return false;
}

function ensureRuntimeSlideRendered(slide, values, opts={}){
  if(!slide) return false;
  const slideId = slide.dataset.vmSlideId;
  const sourceProps = window.__deckViewModel?.model?.slides?.find(item => item.id === slideId)?.props || {};
  const savedProps = window.__deckViewModel?.getState?.().props?.[slideId] || {};
  const next = {...sourceProps, ...savedProps, ...(values || {})};
  const rendered = renderRuntimeSlideWithIsolation(slide, next, opts);
  if(rendered){
    window.__initEditableText?.(slide);
    uniquifyDuplicatedRuntimeSlideSvgIds(slide);
  }
  return rendered;
}
window.__ensureRuntimeSlideRendered = ensureRuntimeSlideRendered;

function prepareSlideForTransition(slide, values, opts={}){
  if(!slide) return false;
  const rendered = ensureRuntimeSlideRendered(slide, values, opts);
  if(opts.isolated && slide.dataset.runtimeRenderError === 'true') return false;
  window.__restoreEffectIframes?.(slide);
  slide.dataset.transitionReady = 'true';
  return rendered || !!slide.firstElementChild;
}
window.__prepareSlideForTransition = prepareSlideForTransition;

function startTransitionSlideEnter(slide){
  if(!slide) return false;
  window.__transitionEnteredSlide = slide;
  slide.dataset.transitionEnterStarted = 'true';
  slide.setAttribute('data-deck-active', '');
  window.__restoreEffectIframes?.(slide);
  window.__syncActiveEffects?.(slide);
  return true;
}
window.__startTransitionSlideEnter = startTransitionSlideEnter;

function preloadAdjacentSlides(activeIndex=idx, opts={}){
  if(deckDiagnosticFlags.disableAdjacentPreload) return;
  const targets = [activeIndex + 1, activeIndex - 1]
    .filter(index => index >= 0 && index < slides.length)
    .map(index => slides[index])
    .filter(Boolean);
  if(!targets.length) return;
  const run = () => {
    applyAdjacentVisibility(activeIndex);
    targets.forEach(slide => prepareSlideForTransition(slide, undefined, {
      isolated:true,
      context:'adjacent preload',
    }));
    window.__releaseInactiveRuntimeSlides?.(slides[activeIndex], {adjacentPreload:true});
  };
  if(opts.immediate){
    run();
    return;
  }
  const delay = Number(opts.delay || 0);
  if(delay > 0){
    if(adjacentPreloadTimer !== null) clearTimeout(adjacentPreloadTimer);
    adjacentPreloadTimer = setTimeout(() => {
      adjacentPreloadTimer=null;
      if(activeIndex === idx) preloadAdjacentSlides(activeIndex);
    }, delay);
    return;
  }
  if('requestIdleCallback' in window) requestIdleCallback(run, {timeout: 260});
  else setTimeout(run, 60);
}
window.__preloadAdjacentSlides = preloadAdjacentSlides;

// Keep the active slide's immediate neighbors painted (content-visibility:visible)
// so adjacent navigation never flashes a blank/un-rendered frame.
function applyAdjacentVisibility(activeIndex=idx){
  const near = new Set();
  [activeIndex - 1, activeIndex + 1].forEach(index => {
    if(index >= 0 && index < slides.length && slides[index]) near.add(slides[index]);
  });
  allSlides.forEach(slide => slide.classList.toggle('cv-near', near.has(slide)));
}

function setActiveThemePack(themePack, opts={}){

const theme10SkipTags = new Set(['STYLE','SCRIPT','BR','HR','DEFS']);
const theme10AtomicTags = new Set(['SVG','CANVAS','IMG','VIDEO','IMAGE-SLOT']);

function theme10ElementChildren(node){
  const out = [];
  for(let child = node?.firstElementChild; child; child = child.nextElementSibling){
    if(!theme10SkipTags.has(child.tagName)) out.push(child);
  }
  return out;
}

function playTheme10Motion(slide){
  if(!slide?.hasAttribute?.('data-deck-active')) return false;
  const wrap = slide?.querySelector?.('.ds-slidewrap');
  const root = wrap?.firstElementChild || wrap;
  if(!root) return false;
  const groups = theme10ElementChildren(root);
  let targets = [];
  groups.forEach(group => {
    const children = theme10ElementChildren(group);
    if(children.length >= 2 && children.length <= 10 && !theme10AtomicTags.has(group.tagName)) targets.push(...children);
    else targets.push(group);
  });
  if(targets.length < 2 || targets.length > 26) targets = groups;
  if(!targets.length) return false;
  targets = targets.map(el => {
    const rect = el.getBoundingClientRect();
    return {el, top:rect.top, left:rect.left};
  }).sort((a,b) => {
    const band = Math.round(a.top / 64) - Math.round(b.top / 64);
    return band !== 0 ? band : a.left - b.left;
  }).map(item => item.el);
  targets.forEach(el => {
    el.classList.remove('ds-anim','ds-fade');
    el.style.removeProperty('--ds-d');
  });
  void root.offsetWidth;
  const step = Math.max(34, Math.min(72, Math.round(620 / targets.length)));
  targets.forEach((el, index) => {
    const position = getComputedStyle(el).position;
    const fade = position === 'absolute' || position === 'fixed' || theme10AtomicTags.has(el.tagName);
    el.style.setProperty('--ds-d', `${50 + index * step}ms`);
    el.classList.add(fade ? 'ds-fade' : 'ds-anim');
  });
  return true;
}

  function attempt(){
    if(!activeSlide?.isConnected || !activeSlide.hasAttribute('data-deck-active')) return;
    if(playTheme10Motion(activeSlide)) return;

  }

}

function go(n, opts={}){

  if(lock){

  }
  const nextIndex=Math.max(0,Math.min(total-1,n));
  const currentSlide=slides[idx];

  const mode = opts.animate === false || nextIndex === idx || nextSlide?.querySelector?.('[data-page-key="theme05_page048"]')

    const transitionOptions = isEditMode() ? {...opts, commitEarly:true, nonBlocking:true} : opts;
    const transition = window.__playPageTransition(mode, currentSlide, nextSlide, nextIndex >= idx ? 1 : -1, commit, transitionOptions);
    if(isEditMode()){

      .catch(error => console.warn('[page transition]', error))

  const state = window.__deckViewModel?.getState?.() || {};
  window.__deckViewModel?.addDuplicatedSlide?.({

function prepareDuplicatedSlideClone(clone, source, copyId){
  clone.id = copyId;
  clone.dataset.vmSlideId = copyId;
  clone.dataset.vmSlideKey = copyId;
  clone.dataset.slideId = copyId;
  clone.dataset.duplicatedSlide = 'true';
  clone.classList.remove('active');
  clone.removeAttribute('data-deck-active');
  clone.removeAttribute('aria-hidden');
  clone.hidden = false;
  clone.querySelectorAll('[data-editable-id]').forEach(el => {
    el.removeAttribute('data-editable-id');
    el.removeAttribute('contenteditable');
    el.removeAttribute('spellcheck');
    el.removeAttribute('role');
    delete el.dataset.editableReady;
    delete el.dataset.editing;
    delete el.dataset.editBefore;
    if(el.dataset.syncText) el.dataset.syncText = `${copyId}:${el.dataset.syncText}`;
  });
  clone.querySelectorAll('[id]').forEach(el => {
    if(el === clone) return;
    if(/^(clip|mask|filter|pattern|gradient|linear|radial)/i.test(el.id || '')) return;
    el.id = `${el.id}__${copyId}`;
  });
  clone.querySelectorAll('image-slot[id],.dslot[id],.acl-slot[id],.kx-imgslot[id],[data-slot-id],[data-dashi-slot-id]').forEach((el, index) => {
    if(el.id) el.id = `${el.id}__${copyId}`;
    if(el.dataset.slotId) el.dataset.slotId = `${copyId}:${el.dataset.slotId}`;
    if(el.dataset.dashiSlotId) el.dataset.dashiSlotId = `${copyId}:${el.dataset.dashiSlotId}`;
    if(el.dataset.mediaKey) el.dataset.mediaKey = `${copyId}:${el.dataset.mediaKey}`;
    if(!el.id && el.tagName?.toLowerCase?.() === 'image-slot') el.id = `${copyId}-slot-${index + 1}`;
  });
}

function toggleCatalogSlideSkipped(catalogIndex){
  refreshSlideList();
  const catalogSlides = getCatalogSlides();
  const slide = catalogSlides[catalogIndex];
  if(!slide) return false;
  const slideId = getSlideVmId(slide);
  const skipped = getSlideStateSet('skippedSlides');
  const currentlySkipped = skipped.has(slideId);
  if(!currentlySkipped && slides.length <= 1) return false;
  const previousActiveSlide = slides[idx];
  const preferredIndex = Math.max(0, slides.indexOf(slide));
  if(currentlySkipped) skipped.delete(slideId);
  else skipped.add(slideId);
  window.__deckViewModel?.setSkippedSlides?.([...skipped]);
  updateAfterCatalogMutation(previousActiveSlide === slide ? null : previousActiveSlide, preferredIndex, {type:currentlySkipped ? 'unskip' : 'skip', slideId});
  return true;
}

function getOverviewGridMetrics(grid=overviewGrid){
  if(!grid) return null;
  const cards = getOverviewCards(grid);
  const firstCard = cards[0];
  if(!firstCard) return null;
  const style = getComputedStyle(grid);
  const columns = (style.gridTemplateColumns || '').split(' ').filter(Boolean).length || 1;
  const rowGap = parseFloat(style.rowGap || style.gap || OVERVIEW_CARD_GAP + 10) || (OVERVIEW_CARD_GAP + 10);
  const cardRect = firstCard.getBoundingClientRect();
  const cardHeight = firstCard.offsetHeight || cardRect.height || 1;
  const nextRowCard = cards[columns];
  const measuredRowHeight = nextRowCard ? nextRowCard.offsetTop - firstCard.offsetTop : 0;
  return {
    columns,
    rowHeight: measuredRowHeight > 0 ? measuredRowHeight : cardHeight + rowGap,
    cardHeight,
    gridTop: firstCard.offsetTop,
  };
}

function getOverviewThumbRange(grid=overviewGrid, {includeNear=false}={}){
  if(!grid) return {cards:[], visibleCards:[], nearCards:[]};
  const cards = getOverviewCards(grid);
  const metrics = getOverviewGridMetrics(grid);
  if(!metrics || !cards.length) return {cards:[], visibleCards:[], nearCards:[]};
  const rangeFor = margin => {
    const top = ov.scrollTop - margin;
    const bottom = ov.scrollTop + ov.clientHeight + margin;
    const startRow = Math.max(0, Math.floor((top - metrics.gridTop) / metrics.rowHeight));
    const endRow = Math.max(startRow, Math.floor((bottom - metrics.gridTop - 1) / metrics.rowHeight));
    const start = Math.max(0, startRow * metrics.columns);
    const end = Math.min(cards.length, (endRow + 1) * metrics.columns);
    return cards.slice(start, end);
  };
  const visibleCards = rangeFor(0);
  const nearCards = includeNear ? rangeFor(OVERVIEW_THUMB_NEAR_MARGIN).filter(card => !visibleCards.includes(card)) : [];
  return {cards:[...visibleCards, ...nearCards], visibleCards, nearCards};
}

    .map(card => card.querySelector('[data-overview-thumb="true"]'))
    .filter(Boolean);
  const visibleRenderedCount = visibleThumbs.filter(wrap => wrap.dataset.overviewRendered === 'true').length;
  const cacheApproxChars = cacheKeys.reduce((sum, key) => {
    const entry = overviewThumbBitmapCache.get(key);
    if(entry?.children?.length){
      cacheDomEntryCount += 1;
      cacheDomNodeCount += Number(entry?.nodeCount || 0);
    }
    return sum + Number(entry?.bytes || entry?.nodeCount || String(entry?.src || '').length);
  }, 0);
  const activeSlide = slides[idx];
  return {
    overviewOn:isEditMode(),
    railActive:isEditMode(),
    cardCount: overviewGrid ? getOverviewCards(overviewGrid).length : 0,
    renderedCount: ov.querySelectorAll('[data-overview-thumb="true"][data-overview-rendered="true"]').length,

function animateOverviewFlow(grid, fromRects){
  if(!fromRects) return;
  requestAnimationFrame(() => {
    getOverviewCards(grid).forEach(card => {
      const from = fromRects[card.dataset.slideKey || card.dataset.index];
      if(!from) return;
      const to = card.getBoundingClientRect();
      const dx = from.left - to.left;
      const dy = from.top - to.top;
      if(Math.abs(dx) < 1 && Math.abs(dy) < 1) return;
      card.style.transition = 'none';
      card.style.transform = `translate(${dx}px, ${dy}px)`;
      requestAnimationFrame(() => {
        card.style.transition = 'outline-color .2s,opacity .2s,transform .32s cubic-bezier(.2,.8,.2,1)';
        card.style.transform = 'translate(0, 0)';
      });
    });
  });
}

function getOverviewDropSlot(e, grid, rects=overviewDragRects){
  if(!rects?.length) return null;
  const y = e.clientY;
  let best = null;
  rects.forEach((item, index) => {
    const rect = item.rect;
    const cy = rect.top + rect.height / 2;
    const x = e.clientX;
    const dx = Math.max(rect.left - x, 0, x - rect.right);
    const dy = Math.max(rect.top - y, 0, y - rect.bottom);
    const distance = dx * dx + dy * dy;
    if(!best || distance < best.distance) best = {item, index, rect, distance, before:y < cy};
  });
  if(!best) return null;
  const index = best.before ? best.index : best.index + 1;
  const marker = getOverviewDropMarkerRect(rects, index);
  return marker ? {index, kind:'horizontal', ...marker} : null;
}

function getOverviewDropMarkerRect(rects, index){
  const previous = rects[index - 1]?.rect;
  const next = rects[index]?.rect;
  let y = 0;
  if(previous && next){
    y = (previous.bottom + next.top) / 2;
  }else if(next){
    y = next.top - OVERVIEW_CARD_GAP / 2;
  }else if(previous){
    y = previous.bottom + OVERVIEW_CARD_GAP / 2;
  }else{
    return null;
  }
  return {y};
}

function applyOverviewPreviewGeometry(node, width, height){
  const targetWidth = OVERVIEW_CARD_WIDTH;
  const targetHeight = OVERVIEW_CARD_WIDTH * OVERVIEW_ASPECT_H / OVERVIEW_ASPECT_W;
  const scale = Math.min(targetWidth / width, targetHeight / height);
  const x = (targetWidth - width * scale) / 2;
  const y = (targetHeight - height * scale) / 2;
  node.dataset.overviewSourceWidth=String(width);
  node.dataset.overviewSourceHeight=String(height);
  node.dataset.overviewFitSignature = `${width}x${height}:${targetWidth}x${targetHeight}`;
  node.style.cssText=`width:${width}px;height:${height}px;--deck-w:${width}px;--deck-h:${height}px;--deck-scale:1;transform-origin:top left;position:absolute;top:0;left:0;margin:0;pointer-events:none;transform:translate(${x}px, ${y}px) scale(${scale});contain:layout paint style`;
}

function fitOverviewThumb(wrap, sourceSize=getOverviewSourceSize()){
    const clone = wrap.firstElementChild;
    if(!clone) return;
    const width = Number(clone.dataset.overviewSourceWidth || 0) || sourceSize.width;
    const height = Number(clone.dataset.overviewSourceHeight || 0) || sourceSize.height;
    const rect = wrap.getBoundingClientRect();
    const targetWidth = rect.width || wrap.clientWidth || OVERVIEW_CARD_WIDTH;
    const targetHeight = rect.height || wrap.clientHeight || (targetWidth * OVERVIEW_ASPECT_H / OVERVIEW_ASPECT_W);
    const roundedTargetWidth = Math.round(targetWidth * 100) / 100;
    const roundedTargetHeight = Math.round(targetHeight * 100) / 100;
    const fitSignature = `${width}x${height}:${roundedTargetWidth}x${roundedTargetHeight}`;
    if(clone.dataset.overviewFitSignature === fitSignature) return;
    wrap.style.aspectRatio = `${OVERVIEW_ASPECT_W} / ${OVERVIEW_ASPECT_H}`;
    clone.style.width = `${width}px`;
    clone.style.height = `${height}px`;
    const scale = Math.min(targetWidth / width, targetHeight / height);
    const x = (targetWidth - width * scale) / 2;
    const y = (targetHeight - height * scale) / 2;
    clone.style.transform = `translate(${x}px, ${y}px) scale(${scale})`;
    clone.dataset.overviewFitSignature = fitSignature;
}

  kicker.style.cssText=`font:700 42px/1 var(--sans);letter-spacing:0;text-transform:uppercase;color:${accent}`;
  const titleEl = document.createElement('div');
  titleEl.textContent = title;
  titleEl.style.cssText='align-self:center;max-width:1420px;font:800 132px/1.05 var(--sans-zh);letter-spacing:0;color:#fff';

  subEl.style.cssText='max-width:1180px;font:500 42px/1.35 var(--sans-zh);letter-spacing:0;color:rgba(247,234,210,.72)';
  plate.append(kicker, titleEl, subEl);
  root.appendChild(plate);
  recordOverviewStage('lite-overview-thumbnail', startAt, {
    slideId:getOverviewStableSlideId(slide),
    count:1,
  });
  return root;
}

function createOverviewDomPreview(slide){
  const derivedStartAt = performance.now();
  // 非隔离调用:这条路径跑在 renderOverviewThumb() 自己的 try/catch 里(见上方 'overview
  // thumb' 报错点),那里有专门的占位 UI 和恢复逻辑,异常必须原样往外传,不能在这里被吞掉。
  ensureRuntimeSlideRendered(slide);
  if(shouldUseLiteOverviewPreview(slide) && !slide.firstElementChild) return createOverviewLitePreview(slide);
  const {width, height} = getOverviewSourceSize();
  const clone = slide.cloneNode(true);
  releaseTemplateVideoElements(clone);
  uniquifySvgCloneIds(clone, 'overview');
  clone.dataset.overviewThumbPreview='true';
  clone.hidden=false;
  clone.classList.add('active');
  clone.setAttribute('data-deck-active', '');
  applyOverviewPreviewGeometry(clone, width, height);
  clone.dataset.overviewSourceWidth=String(width);
  clone.dataset.overviewSourceHeight=String(height);
  clone.style.cssText += ';--deck-scale:1;contain:layout paint style';
  clone.style.animation='none';
  clone.style.transition='none';
  clone.querySelectorAll('script,style,template,noscript').forEach(node => node.remove());
  const freezeStyle = document.createElement('style');
  freezeStyle.textContent='[data-overview-thumb-preview] *,[data-overview-thumb-preview] *::before,[data-overview-thumb-preview] *::after{animation:none!important;animation-delay:0s!important;animation-duration:0s!important;animation-play-state:paused!important;transition:none!important}';
  clone.prepend(freezeStyle);
  clone.querySelectorAll('iframe,video').forEach(node => {
    const placeholder = document.createElement('div');
    placeholder.style.cssText='position:absolute;inset:0;background:rgba(0,0,0,.08)';
    node.replaceWith(placeholder);
  });
  clone.querySelectorAll('[contenteditable],[tabindex],[aria-describedby]').forEach(node => {
    node.removeAttribute('contenteditable');
    node.removeAttribute('tabindex');
    node.removeAttribute('aria-describedby');
  });
  recordOverviewStage('dom-derived-preview', derivedStartAt, {
    slideId:getOverviewStableSlideId(slide),
    candidateCount:clone.querySelectorAll('*').length,
    rectReadCount:0,
    styleReadCount:0,
    count:1,
  });
  return clone;
}

function rememberOverviewThumb(slide, value){
  const entry = {...(value || {})};
  const key = getOverviewThumbCacheKey(slide);
  overviewThumbBitmapCache.set(key, {...entry, revision: getOverviewThumbRevision(slide), usedAt: Date.now()});
  while(overviewThumbBitmapCache.size > OVERVIEW_THUMB_CACHE_LIMIT){
    let oldestKey=null;
    let oldestTime=Infinity;
    overviewThumbBitmapCache.forEach((value, key) => {
      const usedAt = Number(value?.usedAt || 0);
      if(usedAt < oldestTime){
        oldestTime=usedAt;
        oldestKey=key;
      }
    });
    if(!oldestKey) break;
    overviewThumbBitmapCache.delete(oldestKey);
  }
}

function rememberOverviewThumbFromDom(slide, node){
  const child = node.cloneNode(true);
  uniquifySvgCloneIds(child, 'overview-cache');
  rememberOverviewThumb(slide, {
    children:[child],
    nodeCount:node.querySelectorAll('*').length + 1,
  });
}

function requestOverviewClosedPrewarm(delay=900){
  if(overviewClosedPrewarmTimer !== null) clearTimeout(overviewClosedPrewarmTimer);
  overviewClosedPrewarmTimer = setTimeout(() => {
    overviewClosedPrewarmTimer=null;
    runOverviewClosedPrewarm();
  }, delay);
}

function runOverviewClosedPrewarm(){
  const runId = ++overviewClosedPrewarmRunId;
  if(isEditMode()) return;
  const catalogSlides = getCatalogSlides();
  const activeIndex = Math.max(0, catalogSlides.indexOf(slides[idx]));
  const start = Math.max(0, activeIndex - 2);
  const targets = catalogSlides.slice(start, start + 24);
  targets.forEach((slide, order) => {
    setTimeout(() => {
      if(isEditMode() || runId !== overviewClosedPrewarmRunId) return;
      predecodeOverviewSlideResources(slide);
      prewarmOverviewThumbCache(slide, runId);
    }, order * 160);
  });
}

function prewarmOverviewThumbCache(slide, runId){
  if(!slide || isEditMode() || runId !== overviewClosedPrewarmRunId) return;
  const key = getOverviewThumbCacheKey(slide);
  if(overviewThumbBitmapCache.has(key)) return;
  const startAt = performance.now();
  try{
    const preview = createOverviewDomPreview(slide);
    rememberOverviewThumbFromDom(slide, preview);
    recordOverviewStage('closed-rail-thumb-prewarm', startAt, {
      slideId:getOverviewStableSlideId(slide),
      count:1,
    });
  }catch(error){
    reportRuntimeSlideError('overview prewarm', slide, error);
  }finally{
    if(slide !== slides[idx]) window.__releaseRuntimeSlide?.(slide);
  }
}

function predecodeOverviewSlideResources(slide){
  const urls = new Set();
  slide.querySelectorAll('img[src],video[poster],[style*="url("]').forEach(node => {
    const src = node.getAttribute('src') || node.getAttribute('poster');
    if(src) urls.add(src);
    const style = node.getAttribute('style') || '';
    [...style.matchAll(/url\((['"]?)(.*?)\1\)/g)].forEach(match => {
      if(match[2]) urls.add(match[2]);
    });
  });
  [...urls].slice(0, 24).forEach(value => {
    if(!value || /^(data:|blob:)/i.test(value)) return;
    const img = new Image();
    try { img.src = new URL(value, location.href).href; } catch { img.src = value; }
    img.decode?.().catch(() => {});
  });
}

const overviewPreviewCostCache = new WeakMap();
function getOverviewPreviewCost(slide){
  if(!slide) return 0;
  const cached = overviewPreviewCostCache.get(slide);
  if(cached !== undefined) return cached;
  const elementCount = slide.querySelectorAll('*').length;
  const mediaCount = slide.querySelectorAll('img,svg,canvas,video,iframe,[style*="url("]').length;
  const cost = elementCount + mediaCount * 8;
  overviewPreviewCostCache.set(slide, cost);
  return cost;
}

async function renderOverviewThumb(wrap, runId=overviewThumbRunId, opts={}){
  if(!isEditMode() || !wrap?.isConnected || wrap.dataset.overviewRendered === 'true') return;
  if(!opts.allowDuringPause && performance.now() < overviewThumbPauseUntil) return;
  delete wrap.dataset.overviewQueued;
  const card = wrap.closest('[data-overview-card="true"]');
  const slide = card?.__overviewSlide || getCatalogSlides()[Number(card?.dataset.index)];
  if(!slide || runId !== overviewThumbRunId) return;
  const previewStartAt = performance.now();
  const trigger = wrap.dataset.overviewTrigger || 'queue';
  try {
    if(runId !== overviewThumbRunId || !isEditMode() || !wrap.isConnected) return;
    const cachedThumb = overviewThumbBitmapCache.get(getOverviewThumbCacheKey(slide));
    if(cachedThumb && (cachedThumb.revision || '0') === getOverviewThumbRevision(slide)){
      if(restoreOverviewThumb(wrap, cachedThumb)){
        fitOverviewThumb(wrap);
        recordOverviewStage('dom-cache-restore', previewStartAt, {slideId:getOverviewStableSlideId(slide)});
        return;
      }
    } else if(cachedThumb){
      // 内容过期(如页码变化):旧图先占位,继续走完整重渲染覆盖,不闪 placeholder。
      restoreOverviewThumb(wrap, cachedThumb);
    }
    await renderOverviewThumbDomPreview(wrap, slide);
    fitOverviewThumb(wrap);
    recordOverviewStage('dom-preview-thumbnail', previewStartAt, {slideId:getOverviewStableSlideId(slide)});
  } catch (error) {
    if(runId !== overviewThumbRunId || !isEditMode() || !wrap.isConnected) return;
    reportRuntimeSlideError('overview thumb', slide, error);
    delete wrap.dataset.overviewRendered;
    wrap.dataset.overviewMode='placeholder';
    wrap.dataset.overviewError='true';
    if(!wrap.querySelector('[data-overview-placeholder="true"]')) wrap.replaceChildren(createOverviewThumbPlaceholder());
    recordOverviewStage('overview-thumb-error', previewStartAt, {
      slideId:getOverviewStableSlideId(slide),
      count:1,
    });
  } finally {
    recordOverviewStage('overview-thumb-task', previewStartAt, {
      slideId:getOverviewStableSlideId(slide),
      trigger,
    });
    if(slide !== slides[idx]) window.__releaseRuntimeSlide?.(slide);
    requestOverviewProgressUpdate();
  }
}

function scheduleOverviewThumbQueue(opts={}){
  const immediate = !!opts.immediate;
  if(overviewThumbProcessing || !isEditMode()) return;
  if(overviewThumbScheduled){
    if(immediate && overviewThumbQueueHandle !== null){
      clearTimeout(overviewThumbQueueHandle);
      overviewThumbQueueHandle=null;
      overviewThumbScheduled=false;
    }else{
      return;
    }
  }
  overviewThumbScheduled=true;
  const runId = overviewThumbRunId;
  overviewThumbQueueHandle = setTimeout(async () => {
    overviewThumbQueueHandle=null;
    overviewThumbScheduled=false;
    if(!isEditMode() || runId !== overviewThumbRunId) return;
    const sliceStartAt = performance.now();
    const budgetMs = 10;
    overviewPerfMarks.queueRuns.push({at:sliceStartAt, scheduler:'time-sliced', budgetMs, queueLength:overviewThumbQueue.length});
    const nextIndex = getNextOverviewThumbQueueIndex();
    if(nextIndex < 0){
      if(overviewThumbQueue.length) scheduleOverviewThumbQueue();
      return;
    }
    let processed=0;
    while(overviewThumbQueue.length && isEditMode() && runId === overviewThumbRunId){
      const itemIndex = getNextOverviewThumbQueueIndex();
      if(itemIndex < 0) break;
      if(processed > 0 || performance.now() - sliceStartAt >= budgetMs) break;
      const paused = performance.now() < overviewThumbPauseUntil;
      const wrap = overviewThumbQueue.splice(itemIndex, 1)[0];
      if(wrap?.dataset) delete wrap.dataset.overviewQueued;
      if(wrap?.isConnected && wrap.dataset.overviewRendered !== 'true'){
        overviewThumbProcessing=true;
        try {
          await renderOverviewThumb(wrap, runId, {allowDuringPause:paused});
        } finally {
          overviewThumbProcessing=false;
        }
      }
      processed += 1;
      if(processed >= 1) break;
    }
    if(isEditMode() && runId === overviewThumbRunId && overviewThumbQueue.length) scheduleOverviewThumbQueue();
  }, immediate ? 0 : OVERVIEW_THUMB_QUEUE_DELAY);
}

function queueOverviewThumb(wrap, priority=false){
  if(!wrap || wrap.dataset.overviewRendered === 'true') return;
  if(wrap.dataset.overviewQueued === 'true'){
    if(priority){
      const existing = overviewThumbQueue.indexOf(wrap);
      if(existing > 0){
        overviewThumbQueue.splice(existing, 1);
        overviewThumbQueue.unshift(wrap);
      }
    }
    return;
  }
  wrap.dataset.overviewQueued='true';
  wrap.dataset.overviewKey = wrap.closest('[data-overview-card="true"]')?.dataset.slideId || '';
  wrap.dataset.overviewTrigger = priority ? 'visible' : 'near';
  if(priority) overviewThumbQueue.unshift(wrap);
  else overviewThumbQueue.push(wrap);
  scheduleOverviewThumbQueue({immediate:priority});
}

function setOverviewThumbQueue(items, opts={}){
  const next=[];
  const queued=new Set();
  items.forEach(item => {
    const wrap = item?.wrap;
    if(!wrap || queued.has(wrap) || wrap.dataset.overviewRendered === 'true') return;
    queued.add(wrap);
    wrap.dataset.overviewQueued='true';
    wrap.dataset.overviewKey = wrap.closest('[data-overview-card="true"]')?.dataset.slideId || '';
    wrap.dataset.overviewTrigger = item.trigger || 'near';
    next.push(wrap);
  });
  overviewThumbQueue.forEach(wrap => {
    if(!queued.has(wrap) && wrap?.dataset) delete wrap.dataset.overviewQueued;
  });
  overviewThumbQueue=next;
  if(overviewThumbQueue.length) scheduleOverviewThumbQueue({immediate:!!opts.immediate});
}

function queueNearbyOverviewThumbs(opts={}){
  if(!isEditMode()) return;
  const startAt = performance.now();
  const range = getOverviewThumbRange(overviewGrid, {includeNear:true});
  const visibleWraps = getOverviewViewportThumbs();
  overviewProgressThumbs = visibleWraps;
  if(deckDiagnosticFlags.disableThumbGeneration){
    setOverviewThumbQueue([]);
    recordOverviewLayoutRead('queue-nearby', 'range-card-metrics', range.cards.length);
    recordOverviewStage('queue-nearby-overview-thumbs', startAt, {count:range.cards.length, queued:0, disabled:true});
    return;
  }
  let activeWrap = null;
  const activeKey = getOverviewSlideKey(slides[idx]);
  range.cards.forEach(card => {
    const wrap = card.querySelector('[data-overview-thumb="true"]');
    if(card?.dataset.slideKey === activeKey) activeWrap = wrap;
  });
  const items = [];
  const queued = new Set();
  const pushUnique = item => {
    if(!item?.wrap || queued.has(item.wrap)) return;
    if(item.wrap.dataset.overviewRendered === 'true') return;
    queued.add(item.wrap);
    items.push(item);
  };
  if(activeWrap) pushUnique({wrap:activeWrap, trigger:'active'});
  const visibleEntries = visibleWraps
    .map(wrap => {
      const card = wrap.closest('[data-overview-card="true"]');
      return {wrap, trigger:'visible', cost:getOverviewPreviewCost(card?.__overviewSlide)};
    })
    .sort((a, b) => a.cost - b.cost);
  visibleEntries.forEach(pushUnique);
  range.nearCards.forEach(card => {
    const wrap = card.querySelector('[data-overview-thumb="true"]');
    pushUnique({wrap, trigger:'near'});
  });
  if(!items.length && !overviewThumbQueue.length){
    // 可见/近邻卡全部就绪且队列为空:本次调用无事可做,不写队列、不记 stage(布局读仍如实记录)。
    recordOverviewLayoutRead('queue-nearby', 'range-card-metrics', range.cards.length);
    return;
  }
  setOverviewThumbQueue(items, {immediate:!!opts.immediate});
  recordOverviewLayoutRead('queue-nearby', 'range-card-metrics', range.cards.length);
  recordOverviewStage('queue-nearby-overview-thumbs', startAt, {count:range.cards.length, queued:items.length});
}
function queueVisibleOverviewThumbs(){
  queueNearbyOverviewThumbs();
}
window.__queueNearbyOverviewThumbs = queueNearbyOverviewThumbs;

function requestOverviewThumbRefresh(afterPause=false, opts={}){
  if(!isEditMode()) return;
  const runId = overviewThumbRunId;
  const refresh = () => {
    overviewThumbRefreshTimer=null;
    overviewThumbRefreshQueued=false;
    if(runId !== overviewThumbRunId) return;
    if(!isEditMode()) return;
    if(performance.now() < overviewThumbPauseUntil){
      // 排队后 pause 又被后续交互顺延:跟随顺延,不在暂停期内抢主线程。
      requestOverviewThumbRefresh(true, opts);
      return;
    }
    queueNearbyOverviewThumbs({immediate:!!opts.priority});
  };
  if(afterPause){
    if(overviewThumbRefreshTimer !== null) clearTimeout(overviewThumbRefreshTimer);
    overviewThumbRefreshTimer = setTimeout(refresh, Math.max(0, overviewThumbPauseUntil - performance.now()) + 20);
    return;
  }
  if(overviewThumbRefreshQueued) return;
  overviewThumbRefreshQueued=true;
  requestAnimationFrame(refresh);
}

function observeOverviewThumbs(grid){
  const startAt = performance.now();
  overviewThumbObserver?.disconnect();
  overviewThumbObserver = new IntersectionObserver(entries => {
    if(entries.some(entry => entry.isIntersecting)) requestOverviewThumbRefresh();
  }, {root: ov, rootMargin: '600px 0px', threshold: 0.01});
  const wraps = getOverviewThumbRange(grid, {includeNear:true}).cards
    .map(card => card.querySelector('[data-overview-thumb="true"]'))
    .filter(Boolean);
  wraps.forEach(wrap => overviewThumbObserver.observe(wrap));
  recordOverviewStage('observe-overview-thumbnails', startAt, {count:wraps.length});
}

function scrollOverviewToCurrent(){
  requestAnimationFrame(() => {
    const activeSlide = slides[idx];
    const catalogIndex = getCatalogSlides().indexOf(activeSlide);
    const card = catalogIndex >= 0 ? ov.querySelector(`[data-overview-card="true"][data-index="${catalogIndex}"]`) : null;
    scrollRailCardIntoView(card, {queueThumbs:false});
    const range = getOverviewThumbRange(overviewGrid, {includeNear:true});
    fitOverviewThumbnails(range.cards);
    observeOverviewThumbs(overviewGrid);
    queueVisibleOverviewThumbs();
  });
}

function requestOverviewPostBuildThumbRefresh(){
  setTimeout(() => {
    requestAnimationFrame(() => {
      if(!isEditMode() || !overviewGrid) return;
      const range = getOverviewThumbRange(overviewGrid, {includeNear:true});
      fitOverviewThumbnails(range.cards);
      observeOverviewThumbs(overviewGrid);
      queueNearbyOverviewThumbs({immediate:true});
    });
  }, 80);
}

function syncRailActiveState(scroll=false, opts={}){
  if(!overviewGrid) return;
  refreshOverviewCards(overviewGrid);
  if(!scroll) return;
  requestAnimationFrame(() => {
    const activeSlide = slides[idx];
    const catalogIndex = getCatalogSlides().indexOf(activeSlide);
    const card = catalogIndex >= 0 ? ov.querySelector(`[data-overview-card="true"][data-index="${catalogIndex}"]`) : null;
    if(!card) return;
    const railRect = ov.getBoundingClientRect();
    const cardRect = card.getBoundingClientRect();
    if(!(cardRect.top >= railRect.top + 8 && cardRect.bottom <= railRect.bottom - 8)){
      scrollRailCardIntoView(card, {queueThumbs:true});
    }else if(opts.refreshThumbs === false && overviewProgrammaticThumbRefreshNeeded){
      const wrap = card.querySelector('[data-overview-thumb="true"]');
      if(wrap?.dataset.overviewRendered !== 'true') requestProgrammaticRailThumbRefresh();
      else overviewProgrammaticThumbRefreshNeeded=false;
    }
    if(opts.refreshThumbs !== false){
      const activeWrap = card.querySelector('[data-overview-thumb="true"]');
      if(activeWrap?.dataset.overviewRendered === 'true'){
        // 活动卡已在视口内且缩略图就绪:相邻翻页只是高亮移动,无需重跑 fit/observe/排队
        //(视口变化由 IntersectionObserver 守护,滚动路径走 scrollRailCardIntoView)。
        return;
      }
      // 活动卡未就绪:等导航暂停期结束后统一刷新,连续翻页期间不让缩略图管线抢主线程。
      requestOverviewThumbRefresh(true);
    }
  });
}
window.__syncRailActiveState = syncRailActiveState;

function scrollRailCardIntoView(card, opts={}){
  if(!card) return;
  overviewProgrammaticScrollUntil = performance.now() + 500;
  const scroller = card.closest('[data-rail-scroll="true"]') || ov;
  if(scroller){
    const railRect = scroller.getBoundingClientRect();
    const cardRect = card.getBoundingClientRect();
    const target = scroller.scrollTop + (cardRect.top - railRect.top) - Math.max(0, (scroller.clientHeight - cardRect.height) / 2);
    scroller.scrollTop = Math.max(0, target);
  }else{
    card.scrollIntoView({block:'center', inline:'nearest'});
  }
  if(opts.queueThumbs !== false){
    overviewProgrammaticThumbRefreshNeeded=true;
    requestProgrammaticRailThumbRefresh();
  }
}

function requestProgrammaticRailThumbRefresh(){
  requestOverviewThumbRefresh(true, {priority:true});
}

function cloneOverviewThumb(wrap){
  if(wrap?.dataset?.overviewRendered === 'true'){
    const children = [...(wrap?.children || [])].map(child => uniquifySvgCloneIds(child.cloneNode(true), 'overview-copy'));
    return {
      children,
      nodeCount: children.reduce((sum, child) => sum + 1 + (child.querySelectorAll?.('*').length || 0), 0),
    };
  }
  return {
    children: [...(wrap?.children || [])].map(child => uniquifySvgCloneIds(child.cloneNode(true), 'overview-copy')),
  };
}

function restoreOverviewThumb(wrap, cached){
  if(cached?.children?.length){
    wrap.replaceChildren(...cached.children.map(child => uniquifySvgCloneIds(child.cloneNode(true), 'overview-restore')));
    wrap.dataset.overviewMode='dom-clone';
    wrap.dataset.overviewRendered='true';
    return true;
  }
  return false;
}

function getOverviewThumbCacheKey(slide){
  const themePack = slide?.dataset.themePack || activeThemePack || document.documentElement.dataset.themePack || 'deck';
  const slideId = getSlideVmId(slide);
  // revision 不进 key:内容过期由 entry.revision 判定,旧图可先上屏再后台刷新,避免闪 placeholder。
  return `${themePack}|${slideId}|${OVERVIEW_THUMB_WIDTH}x${OVERVIEW_THUMB_HEIGHT}`;
}

function markOverviewThumbDirty(slide){
  if(!slide) return;
  const key = getOverviewStableSlideId(slide);
  bumpOverviewThumbRevision(slide);
  [...overviewThumbBitmapCache.keys()].forEach(cacheKey => {
    if(cacheKey.includes(`|${key}|`)) overviewThumbBitmapCache.delete(cacheKey);
  });
  let needsRefresh=false;
  ov.querySelectorAll(`[data-overview-card="true"][data-slide-key="${key}"] [data-overview-thumb="true"]`).forEach(wrap => {
    delete wrap.dataset.overviewRendered;
    delete wrap.dataset.overviewMode;
    delete wrap.dataset.overviewQueued;
    wrap.replaceChildren(createOverviewThumbPlaceholder());
    needsRefresh=true;
  });
  if(isEditMode() && needsRefresh){
    deferOverviewThumbs(650, 'dirty');
    requestOverviewThumbRefresh(true);
  }
  requestOverviewProgressUpdate();
}
window.__markOverviewThumbDirty = markOverviewThumbDirty;
window.__markRailThumbDirty = markOverviewThumbDirty;

function createOverviewThumbPlaceholder(){
  const fragment = document.createDocumentFragment();
  const placeholder=document.createElement('div');
  placeholder.setAttribute('data-overview-placeholder', 'true');
  placeholder.style.cssText='position:absolute;inset:0;background:linear-gradient(135deg,rgba(255,255,255,.14),rgba(0,0,0,.08)),repeating-linear-gradient(135deg,rgba(0,0,0,.08) 0 1px,transparent 1px 12px);opacity:.55';
  const placeholderText=document.createElement('div');
  placeholderText.style.cssText='position:absolute;left:10px;top:10px;padding:4px 7px;border-radius:999px;background:rgba(255,255,255,.72);color:rgba(0,0,0,.58);font:600 11px/1 var(--sans-zh);letter-spacing:0';
  placeholderText.textContent=window.__deckI18n.ui('生成中');
  fragment.append(placeholder, placeholderText);
  return fragment;
}

function getOverviewStructureSignature(catalogSlides=getCatalogSlides()){
  const skipped = getSlideStateSet('skippedSlides');
  const body = catalogSlides.map((slide, index) => {
    const allIndex = allSlides.indexOf(slide);
    const slideId = getSlideVmId(slide, allIndex);
    return `${slide.dataset.themePack || activeThemePack || ''}:${slideId}:${skipped.has(slideId) ? 'skip' : 'show'}:${index}`;
  }).join('|');
  return `${activeThemePack || 'deck'}|${body}`;
}

function refreshOverviewCards(grid=overviewGrid){
  if(!grid) return;
  refreshSlideList();
  const catalogSlides = getCatalogSlides();
  const catalogTotal = catalogSlides.length;
  const playableIndexBySlide = new Map(slides.map((slide, index) => [slide, index]));
  getOverviewCards(grid).forEach((card, index) => {
    const slide = card.__overviewSlide || catalogSlides[index];
    if(!slide) return;
    const playableIndex = playableIndexBySlide.get(slide) ?? -1;
    const active = playableIndex === idx;
    card.dataset.index = index;
    card.dataset.slideKey = getOverviewSlideKey(slide);
    card.dataset.slideId = getOverviewStableSlideId(slide);
    card.dataset.overviewActive = active ? 'true' : 'false';
    card.dataset.railActive = active ? 'true' : 'false';
    card.setAttribute('aria-current', active ? 'true' : 'false');
    const label = card.querySelector('[data-overview-label="true"]');
    if(label) label.textContent = String(index + 1).padStart(2,'0') + '/' + String(catalogTotal).padStart(2,'0');
    const skipped = isSlideSkipped(slide, allSlides.indexOf(slide));
    card.style.opacity = skipped ? '.56' : '1';
    card.style.filter = skipped ? 'saturate(.62)' : 'none';
    let badge = card.querySelector('.rail-skip-badge');
    if(skipped && !badge){
      badge=document.createElement('div');
      badge.className='rail-skip-badge';
      badge.textContent=window.__deckI18n.ui('已跳过');
      card.appendChild(badge);
    }else if(!skipped && badge){
      badge.remove();
    }
  });
}

function applyOverviewReorderLocally(grid, fromIndex, insertIndex, fromRects){
  const cards = getOverviewCards(grid);
  const card = cards[fromIndex];
  if(!card) return null;
  let targetIndex = insertIndex;
  if(fromIndex < targetIndex) targetIndex -= 1;
  const remaining = cards.filter((_, index) => index !== fromIndex);
  targetIndex = Math.max(0, Math.min(remaining.length, targetIndex));
  const marker = grid.querySelector('[data-overview-drop-marker="true"]');
  grid.insertBefore(card, remaining[targetIndex] || marker || null);
  refreshOverviewCards(grid);
  animateOverviewFlow(grid, fromRects);
  return targetIndex;
}

function scheduleOverviewDeckCommit(grid, previousActiveSlide, preferredIndex, detail, dropMark){
  const orderedSlides = getOverviewCards(grid).map(card => card.__overviewSlide).filter(Boolean);
  dropMark.deckCommitScheduledAt = performance.now();
  if(overviewPendingDeckCommit !== null) clearTimeout(overviewPendingDeckCommit);
  overviewPendingDeckCommit = setTimeout(() => {
    overviewPendingDeckCommit=null;
    const commitStartAt = performance.now();
    const movedSlide = orderedSlides[detail.to] || null;
    const referenceSlide = orderedSlides[detail.to + 1] || null;
    let deckMoveCount = 0;
    if(movedSlide){
      deck.insertBefore(movedSlide, referenceSlide);
      deckMoveCount = 1;
    }
    const appendEndAt = performance.now();
    refreshSlideList();
    const activeIndex = previousActiveSlide ? slides.indexOf(previousActiveSlide) : -1;
    idx = total > 0
      ? (activeIndex >= 0 ? activeIndex : Math.max(0, Math.min(total - 1, preferredIndex || 0)))
      : 0;
    window.__currentSlideIndex = idx;
    syncNav();
    layoutDeck();
    writeStoredSlideIndex(idx);
    persistCatalogSlideOrder();
    const mutationEndAt = performance.now();
    dispatchEvent(new CustomEvent('swiss-slide-reorder', {detail:{from:detail.from, to:detail.to, index:idx}}));
    dispatchEvent(new CustomEvent('swiss-slide-catalog-change', {detail:{...detail, skipOverviewRebuild:true}}));
    syncRailActiveState(true, {refreshThumbs:false});
    requestAnimationFrame(() => syncRailActiveState(true, {refreshThumbs:false}));
    setTimeout(() => syncRailActiveState(true, {refreshThumbs:false}), 120);
    dropMark.deckCommittedAt = performance.now();
    dropMark.deckCommitDurationMs = dropMark.deckCommittedAt - commitStartAt;
    dropMark.deckAppendDurationMs = appendEndAt - commitStartAt;
    dropMark.deckMutationDurationMs = mutationEndAt - appendEndAt;
    dropMark.deckMoveCount = deckMoveCount;
    dropMark.deckOrderAfterCommit = getOverviewDeckOrder();
    recordOverviewStage('deck-commit', commitStartAt, {
      count:deckMoveCount,
      appendMs:dropMark.deckAppendDurationMs,
      mutationMs:dropMark.deckMutationDurationMs,
    });
  }, 80);
}

function buildOverview(fromRects=null, fromThumbs=null){

      pauseOverviewThumbs();

      e.dataTransfer.setData('text/plain', String(overviewDragFrom));

    card.addEventListener('dragend', ()=>{
      deferOverviewThumbs(650, 'dragend');
      overviewDragFrom=null;
      overviewDidDrag=false;
      overviewSuppressClickUntil=performance.now() + 180;
      overviewDragRects=[];
      overviewPendingDragEvent=null;

      card.classList.remove('is-dragging');

    const slot = getOverviewDropSlot({clientX:e.clientX, clientY:e.clientY}, grid, overviewDragRects);

      id:++overviewDropSequence,
      dropStartAt:performance.now(),

      requestedTo:slot.index,
      overviewOrderBeforeDrop:getOverviewOrderFromCards(grid),
      deckOrderBeforeDrop:getOverviewDeckOrder(),

      scrollOverviewToCurrent();

    overviewDragFrom=null;
    overviewDidDrag=false;
    overviewSuppressClickUntil=performance.now() + 180;
    overviewDropIndex=null;
    overviewDragRects=[];
    overviewPendingDragEvent=null;
    hideOverviewDropMarker(dropMarker);
  });
  ov.appendChild(grid);
  overviewGrid=grid;

const DECK_NEXT_KEYS=new Set(['ArrowRight','PageDown','ArrowDown']);
const DECK_PREV_KEYS=new Set(['ArrowLeft','PageUp','ArrowUp']);


function handleDeckKeyNavigation(e,{allowSpace=true}={}){
  if(window.__deckExportLocked){e.preventDefault();return;}
  if(e.key==='Escape'){
    if(isPresentMode()){
      if(document.fullscreenElement) return;
      e.preventDefault();
      exitPresentMode();
    }
    return;
  }
  if(isEditMode()){
    if(DECK_NEXT_KEYS.has(e.key)){
      e.preventDefault();
      go(idx+1, {refreshRailThumbs:false});
      return;
    }
    if(DECK_PREV_KEYS.has(e.key)){
      e.preventDefault();
      go(idx-1, {refreshRailThumbs:false});
      return;
    }
    if(e.key==='Home'){e.preventDefault();go(0, {refreshRailThumbs:false});return;}
    if(e.key==='End'){e.preventDefault();go(total-1, {refreshRailThumbs:false});}
    return;
  }
  if(DECK_NEXT_KEYS.has(e.key)||(allowSpace&&e.key===' ')){
    e.preventDefault();
    if(window.__pipeAdvance && window.__pipeAdvance()) return;
    go(idx+1);
    return;
  }
  if(DECK_PREV_KEYS.has(e.key)){e.preventDefault();go(idx-1);return;}
  if(e.key==='Home'){e.preventDefault();go(0);return;}
  if(e.key==='End'){e.preventDefault();go(total-1);}
}
window.__handleDeckKeyNavigation=handleDeckKeyNavigation;

function isPreviewPanelNavigationTarget(target){
  if(target?.closest?.('#business-icon-panel [role="radio"]')) return false;
  if(!target?.closest?.('#preview-panel')) return false;
  return !target.closest?.('select,textarea,input[type="text"],input[type="search"],input[type="url"],input[type="email"],input[type="number"],input[type="range"],input[type="color"],[contenteditable="true"],[contenteditable="plaintext-only"],[role="textbox"]');
}

addEventListener('keydown',e=>{
  if(!isPreviewPanelNavigationTarget(e.target)) return;
  const isDeckKey = DECK_NEXT_KEYS.has(e.key) || DECK_PREV_KEYS.has(e.key) || e.key === 'Home' || e.key === 'End';
  if(!isDeckKey) return;
  e.preventDefault();
  e.stopImmediatePropagation();
  e.target?.blur?.();
  handleDeckKeyNavigation(e);
}, true);

addEventListener('keydown',e=>{

let tx=0,ty=0;
addEventListener('touchstart',e=>{tx=e.touches[0].clientX;ty=e.touches[0].clientY},{passive:true});

<script>
/* =============== Preview Undo =============== */
(function(){
  const undoStack = [];
  const redoStack = [];
  const undoButton = document.getElementById('preview-undo');
  const redoButton = document.getElementById('preview-redo');
  let applying = false;
  const api = window.__dashiUndo = {
    get applying(){ return applying; },
    get canUndo(){ return undoStack.length > 0; },
    get canRedo(){ return redoStack.length > 0; },
    push(action){
      if(applying || !action || typeof action.undo !== 'function') return;
      const now = Date.now();
      const last = undoStack[undoStack.length - 1];
      if(action.mergeKey && last?.mergeKey === action.mergeKey && now - (last.timestamp || 0) < 1200){
        last.redo = action.redo;
        last.timestamp = now;
      }else{
        action.timestamp = now;
        undoStack.push(action);
        if(undoStack.length > 80) undoStack.shift();
      }
      redoStack.length = 0;
      syncButtons();
    },
    undo(){
      const action = undoStack.pop();
      if(!action) return false;
      // Compatibility for already-shipped theme bundles whose media entry had
      // only undo. Capture only slides actually changed by this undo operation.
      const mediaSnapshots=action.label==='media'&&typeof action.redo!=='function'&&window.__layoutEditor?.restoreProps
        ? [...document.querySelectorAll('#deck>.slide')].map(slide=>({slide,id:slide.dataset.vmSlideId,props:JSON.parse(JSON.stringify(window.__layoutEditor.getProps(slide)))})) : null;
      applying = true;
      try { action.undo(); }
      finally { applying = false; }
      if(mediaSnapshots){const changed=mediaSnapshots.filter(s=>JSON.stringify(s.props)!==JSON.stringify(window.__layoutEditor.getProps(s.slide)));if(changed.length)action.redo=()=>changed.forEach(s=>window.__layoutEditor.restoreProps(s.id,s.props));}
      if(typeof action.redo === 'function') redoStack.push(action);
      syncButtons();
      return true;
    },
    redo(){
      const action = redoStack.pop();
      if(!action || typeof action.redo !== 'function') return false;
      applying = true;
      try { action.redo(); }
      finally { applying = false; }
      undoStack.push(action);
      syncButtons();
      return true;
    },
    clear(){
      undoStack.length = 0;
      redoStack.length = 0;
      syncButtons();
    }
  };
  function syncButtons(){
    if(undoButton) undoButton.disabled = !api.canUndo;
    if(redoButton) redoButton.disabled = !api.canRedo;
    dispatchEvent(new CustomEvent('dashi-history-change', {detail:{canUndo:api.canUndo, canRedo:api.canRedo}}));
  }
  undoButton?.addEventListener('click', () => api.undo());
  redoButton?.addEventListener('click', () => api.redo());
  addEventListener('keydown', event => {
    const key = String(event.key || '').toLowerCase();
    const modifier = event.metaKey || event.ctrlKey;
    const wantsUndo = modifier && key === 'z' && !event.shiftKey && !event.altKey;
    const wantsRedo = modifier && !event.altKey && ((key === 'z' && event.shiftKey) || (key === 'y' && !event.shiftKey));
    if(!wantsUndo && !wantsRedo) return;
    if(isDeckTypingTarget(event.target)) return;
    if((wantsRedo ? api.redo() : api.undo())){
      event.preventDefault();
      event.stopImmediatePropagation();
    }
  }, true);
  syncButtons();
})();
</script>
