  const defaultThemePack = Object.keys(themePacks).find(key => /^theme\d{2}$/.test(key)) || '';
  const previewCountButtonLimit = normalizePreviewCountButtonLimit(
    options.previewControls?.countButtonMaxValue ?? options.previewCountButtonLimit,
  );
  const initialThemePack = normalizeThemePack(urlThemePack)
    || normalizeThemePack(saved.themePack)
    || normalizeThemePack(options.current?.themePack)
    || normalizeThemePack(document.documentElement.dataset.themePack)
    || defaultThemePack;
  const state = {
    themePack: initialThemePack,
    pageTransition: transitionModes.includes(saved.pageTransition)
      ? saved.pageTransition
      : (transitionModes.includes(options.current?.pageTransition) ? options.current.pageTransition : 'none'),
    pageTransitionColors: sanitizeTransitionColors(saved.pageTransitionColors || options.current?.pageTransitionColors || {}),
  };
  window.__getPreviewState = () => ({...state});
  makePreviewControlKeyboardNeutral(themePackSelect, {blurOnPointer:false});
  makePreviewControlKeyboardNeutral(transitionSelect, {blurOnPointer:false});

  const count = document.getElementById('preview-slide-count');
  renderThemePackControl();
  refreshDeckSlides();
  window.__setActiveThemePack?.(state.themePack || defaultThemePack || '', {navigate:false});
  refreshDeckSlides();
  const TX_COLOR_STOPS = [
    [0, [0,0,0]],
    [0.10, [255,0,0]],
    [0.25, [255,255,0]],
    [0.40, [0,255,0]],
    [0.55, [0,255,255]],
    [0.70, [0,0,255]],
    [0.85, [255,0,255]],
    [1, [255,255,255]],
  ];
  const TX_SLIDER_MAX = 1000;
  function txHex2(n){ return Math.max(0, Math.min(255, Math.round(n))).toString(16).padStart(2,'0'); }
  function txColorAt(t){
    t = Math.max(0, Math.min(1, t));
    for(let i=1;i<TX_COLOR_STOPS.length;i++){
      const [p1,c1] = TX_COLOR_STOPS[i-1];
      const [p2,c2] = TX_COLOR_STOPS[i];
      if(t <= p2){
        const f = p2 === p1 ? 0 : (t - p1) / (p2 - p1);
        return '#' + txHex2(c1[0]+(c2[0]-c1[0])*f) + txHex2(c1[1]+(c2[1]-c1[1])*f) + txHex2(c1[2]+(c2[2]-c1[2])*f);
      }
    }
    return '#ffffff';
  }
  function txHexToRgb(hex){
    const m = /^#?([0-9a-f]{6})$/i.exec(hex || '');
    if(!m) return null;
    const n = parseInt(m[1], 16);
    return [(n>>16)&255, (n>>8)&255, n&255];
  }
  function txColorToPos(hex){
    const target = txHexToRgb(hex);
    if(!target) return 0;
    let bestPos = 0, bestD = Infinity;
    for(let i=0;i<=TX_SLIDER_MAX;i++){
      const c = txHexToRgb(txColorAt(i / TX_SLIDER_MAX));
      const d = (c[0]-target[0])**2 + (c[1]-target[1])**2 + (c[2]-target[2])**2;
      if(d < bestD){ bestD = d; bestPos = i; if(d === 0) break; }
    }
    return bestPos;
  }

  function readSaved(){
    try {
      return JSON.parse(localStorage.getItem(window.__previewStoreKey?.() || STORE) || '{}');
    } catch {
      return {};
    }
  }

  function writeSaved(){
    localStorage.setItem(window.__previewStoreKey?.() || STORE, JSON.stringify(state));
    scheduleViewParamsWrite();
  }

  function releasePreviewControlFocus(control){
    requestAnimationFrame(() => control?.blur?.());
  }

  function makePreviewControlKeyboardNeutral(control, opts={}){
    if(!control) return control;
    control.tabIndex = -1;
    if(opts.blurOnPointer !== false){
      control.addEventListener('pointerup', () => releasePreviewControlFocus(control));
      control.addEventListener('touchend', () => releasePreviewControlFocus(control), {passive:true});
    }
    return control;
  }

  function refreshDeckSlides(){
    deckSlides = readPreviewDeckSlides();
    if(count) count.textContent = window.__deckI18n.ui('{current}/{total}页', {current: Math.min(deckSlides.length, Math.max(1, (window.__currentSlideIndex || 0) + 1)), total: deckSlides.length});
  }

  function readPreviewDeckSlides(){
    const runtimeSlides = window.__getVisibleSlides?.();
    const deckRuntimeSlides = Array.isArray(runtimeSlides)
      ? runtimeSlides.filter(slide => slide?.parentElement?.id === 'deck')
      : [];
    if(deckRuntimeSlides.length) return deckRuntimeSlides;
    return [...document.querySelectorAll('#deck > .slide:not([hidden])')];
  }

  function renderThemePackControl(){
    if(!themePackField || !themePackSelect) return;
    const entries = Object.entries(themePacks);
    if(!entries.length){
      themePackField.classList.add('is-hidden');
      return;
    }
    const counts = countSlidesByThemePack();
    themePackSelect.innerHTML = '';
    entries.forEach(([key, option]) => {
      const optionEl = document.createElement('option');
      const slideCount = counts[key] || 0;
      optionEl.value = key;
      optionEl.textContent = window.__deckI18n?.meta(option.label || option.displayName || key) ?? (option.label || option.displayName || key);
      optionEl.title = [option.scenario, option.audience].filter(Boolean).join('\n');
      optionEl.disabled = slideCount === 0;
      themePackSelect.appendChild(optionEl);
    });
    const nextThemePack = counts[state.themePack] ? state.themePack : entries.find(([key]) => counts[key])?.[0] || state.themePack;
    if(nextThemePack) state.themePack = nextThemePack;
    themePackSelect.value = state.themePack;
    themePackField.classList.remove('is-hidden');
  }

  function countSlidesByThemePack(){
    return [...document.querySelectorAll('#deck > .slide')].reduce((acc, slide) => {
      const key = slide.dataset.themePack || '';
      if(key) acc[key] = (acc[key] || 0) + 1;
      return acc;
    }, {});
  }

  function normalizeThemePack(value){
    if(!value || !themePacks[value]) return '';
    return value;
  }

  function normalizeTransitionColor(value){
    return /^#[0-9a-f]{6}$/i.test(value || '') ? value.toLowerCase() : '';
  }

  function sanitizeTransitionColors(source){
    const colors = {};
    const defaults = window.__pageTransitionColorDefaults || {};
    Object.entries(source || {}).forEach(([mode, value]) => {
      const color = normalizeTransitionColor(value);
      if(defaults[mode] && color) colors[mode] = color;
    });
    return colors;
  }

  transitionSelect?.addEventListener('change', () => {
    setPageTransition(transitionSelect.value || 'none', {blur:true});
  });

  function setPageTransition(value, opts={}){
    state.pageTransition = transitionModes.includes(value) ? value : 'none';
    window.__setPageTransition?.(state.pageTransition);
    syncTransitionColorControl();
    if(transitionSelect) transitionSelect.value = state.pageTransition;
    if(opts.blur) transitionSelect?.blur();
    writeSaved();
  }

  themePackSelect?.addEventListener('change', () => {
    if(!themePackSelect.value || themePackSelect.selectedOptions[0]?.disabled) return;
    state.themePack = themePackSelect.value;
    window.__setActiveThemePack?.(state.themePack);
    refreshDeckSlides();
    applyStoredSlideControls();
    renderPropControls();
    writeSaved();
    releasePreviewControlFocus(themePackSelect);
  });

  addEventListener('swiss-slide-change', refreshSlideControls);
  addEventListener('swiss-slide-reorder', refreshSlideControls);
  addEventListener('rd-themechange', refreshSlideControls);
  addEventListener('rd-accentchange', refreshSlideControls);

  function refreshSlideControls(){
    refreshDeckSlides();
    renderPropControls();
  }

  function syncTransitionControl(){
    if(transitionSelect) transitionSelect.value = state.pageTransition || 'none';
    window.__setPageTransition?.(state.pageTransition || 'none');
    Object.entries(state.pageTransitionColors || {}).forEach(([mode, color]) => window.__setPageTransitionColor?.(mode, color));
    syncTransitionColorControl();
  }

  function renderTransitionColorOptions(){
    if(!transitionColorOptions) return;
    transitionColorOptions.innerHTML = '';
    const wrap = document.createElement('div');
    wrap.className = 'preview-transition-color-slider';
    const range = document.createElement('input');
    range.type = 'range';
    range.min = '0';
    range.max = String(TX_SLIDER_MAX);
    range.step = '1';
    range.id = 'preview-transition-color-range';
    range.setAttribute('data-transition-color-range', 'true');
    range.setAttribute('aria-label', window.__deckI18n.ui('切换色块颜色'));
    makePreviewControlKeyboardNeutral(range);
    const readout = document.createElement('span');
    readout.className = 'preview-transition-color-readout';
    readout.setAttribute('data-transition-color-readout', 'true');
    const apply = persist => {
      const color = txColorAt(Number(range.value) / TX_SLIDER_MAX);
      range.style.setProperty('--tx-thumb', color);
      readout.textContent = color.toUpperCase();
      updateTransitionColor(color, {persist, syncControl:false});
    };
    range.addEventListener('input', () => apply(false));
    range.addEventListener('change', () => { apply(true); releasePreviewControlFocus(range); });
    wrap.appendChild(range);
    transitionColorOptions.appendChild(wrap);
    transitionColorOptions.appendChild(readout);
  }

  function syncTransitionColorControl(){
    if(!transitionColorField || !transitionColorOptions) return;
    const mode = state.pageTransition || 'none';
    const canColor = !!window.__isPageTransitionColorMode?.(mode);
    transitionColorField.classList.toggle('is-hidden', !canColor);
    if(!canColor) return;
    const color = normalizeTransitionColor(state.pageTransitionColors?.[mode])
      || normalizeTransitionColor(window.__getPageTransitionColor?.(mode))
      || normalizeTransitionColor(window.__pageTransitionColorDefaults?.[mode])
      || '#000000';
    window.__setPageTransitionColor?.(mode, color);
    syncTransitionColorButtons(window.__getPageTransitionColor?.(mode) || color);
  }

  function updateTransitionColor(value, opts={}){
    const mode = state.pageTransition || 'none';
    if(!window.__isPageTransitionColorMode?.(mode)) return;
    const color = normalizeTransitionColor(value);
    if(!color) return;
    state.pageTransitionColors = {...(state.pageTransitionColors || {}), [mode]: color};
    window.__setPageTransitionColor?.(mode, color);
    if(opts.syncControl !== false) syncTransitionColorButtons(color);
    if(opts.persist) writeSaved();
  }

  function syncTransitionColorButtons(color){
    if(!transitionColorOptions) return;
    const current = normalizeTransitionColor(color) || '#000000';
    const range = transitionColorOptions.querySelector('[data-transition-color-range]');
    const readout = transitionColorOptions.querySelector('[data-transition-color-readout]');
    if(range){
      range.value = String(txColorToPos(current));
      range.style.setProperty('--tx-thumb', current);
    }
    if(readout) readout.textContent = current.toUpperCase();
  }

  function applyStoredSlideControls(){
    const vmState = viewModel?.getState?.() || {};
    const slide = getCurrentSlide();
    if(slide) applyPropValues(slide, getSlidePropValues(slide, vmState), {persist:false});
  }

  function getCurrentPropRoot(){
    return getCurrentSlide()?.querySelector('[data-prop-controls]') || null;
  }

  function parsePropControls(root){
    try {
      const controls = JSON.parse(root?.dataset.propControls || '[]') || [];
      return [...TYPOGRAPHY_CONTROLS, ...controls].map(translatePropControlForDisplay);
    } catch {
      return TYPOGRAPHY_CONTROLS.map(translatePropControlForDisplay);
    }
  }

  // 显示层翻译(en 下查 metadata 词典,miss 回退中文);只影响面板展示,
  // 不触碰 key/value/options 的取值逻辑。
  function translatePropControlForDisplay(control){
    const i18n = window.__deckI18n;
    if(!i18n?.isEn || !control || typeof control !== 'object') return control;
    const next = { ...control };
    if(typeof next.labelEn === 'string') next.label = next.labelEn;
    else if(typeof next.label === 'string') next.label = i18n.meta(next.label);
    if(typeof next.desc === 'string') next.desc = i18n.meta(next.desc);
    if(typeof next.description === 'string') next.description = i18n.meta(next.description);
    if(typeof next.unit === 'string') next.unit = i18n.meta(next.unit);
    return next;
  }

  function orderPropControlsForPanel(controls, root){
    if(root?.dataset.themeKey !== 'theme12') return controls || [];
    const toneControls = [];
    const rest = [];
    (controls || []).forEach(control => {
      (isToneThemeControl(control) ? toneControls : rest).push(control);
    });
    return [...toneControls, ...rest];
  }

  function isToneThemeControl(control){
    if(control?.key !== 'theme') return false;
    const values = propOptions(control).map(item => String(item.value));
    return values.includes('light') && values.includes('dark');
  }

  function parsePropDefaults(root){
    try {
      return JSON.parse(root?.dataset.propDefaults || '{}') || {};
    } catch {
      return {};
    }
  }

  function getSlidePropValues(slide, vmState = viewModel?.getState?.() || {}){
    const root = slide?.querySelector('[data-prop-controls]');
    if(!root) return {};
    const controls = parsePropControls(root).filter(control => !isHiddenPropControl(control));
    const defaults = parsePropDefaults(root);
    const typographyDefaults = Object.fromEntries(TYPOGRAPHY_CONTROLS.map(control => [control.key, control.default]));
    const sourceProps = getSlideSourceProps(slide);
    const savedProps = vmState.props?.[slide.dataset.vmSlideId] || {};
    const draftProps = typographyDrafts.get(slide.dataset.vmSlideId) || {};
    let slideTextStyles = {};
    try { slideTextStyles = JSON.parse(slide.dataset.editorTextStyles || '{}') || {}; } catch {}
    const slideTypographyProps = slide.hasAttribute('data-editor-text-styles')
      ? {editorTextStyles:slideTextStyles}
      : {};
    let slideShapeStyles = {};
    try { slideShapeStyles = JSON.parse(slide.dataset.editorShapeStyles || '{}') || {}; } catch {}
    const slideShapeProps = slide.hasAttribute('data-editor-shape-styles')
      ? {editorShapeStyles:slideShapeStyles}
      : {};
    const values = {...typographyDefaults, ...defaults, ...sourceProps, ...savedProps, ...draftProps, ...slideTypographyProps, ...slideShapeProps};
    controls.forEach(control => {
      values[control.key] = coercePropValue(control, values[control.key]);
    });
    return window.__normalizeHwTemplateProps?.(slide,values) || values;
  }

  function getSlideSourceProps(slide){
    const slideId = slide?.dataset.vmSlideId;
    if(!slideId) return {};
    return viewModel?.model?.slides?.find(item => item.id === slideId)?.props || {};
  }

  function getImageVisibilitySpecs(controls, values){
    const specs=[];
    const usedCountKeys=new Set();
    const append=(imageControl,countControl)=>{
      if(!countControl||usedCountKeys.has(countControl.key)) return;
      const optionValues = propOptions(countControl)
        .map(item => Number(item.value))
        .filter(Number.isFinite);
      const configuredMax = Number(countControl.max);
      const valueMax = Math.max(0, Number(values?.[countControl.key]) || 0);
      const max = Math.max(
        1,
        Number.isFinite(configuredMax) ? configuredMax : 0,
        optionValues.length ? Math.max(...optionValues) : 0,
        valueMax,
      );
      specs.push({imageControl, countControl, max:Math.min(12, Math.round(max))});
      usedCountKeys.add(countControl.key);
    };
    (controls || []).forEach(imageControl=>{
      if(normalizePropControlType(imageControl?.type, imageControl) !== 'image-list' || !imageControl?.countKey) return;
      append(imageControl,controls.find(item=>item?.key===imageControl.countKey));
    });
    (controls || []).forEach(countControl=>{
      if(!isMediaVisibilityCountControl(countControl)||usedCountKeys.has(countControl.key)) return;
      append({key:`${countControl.key}Images`,label:'图片'},countControl);
    });
    return specs;
  }

  function isMediaVisibilityCountControl(control){
    const key=String(control?.publicKey||control?.key||'');
    if(/^(image|images|media|photo|photos|picture|pictures|logo|logos|thumb|thumbs|avatar|avatars|frame|frames).*Count$/i.test(key)) return true;
    const label=String(control?.label||'');
    return /(图片|照片|配图|主图|背景图|缩略图|头像|Logo)/i.test(label)
      && /(数量|张数|呈现)/i.test(label);
  }

  function renderImageVisibilityControls(target, specs, values){
    (specs || []).forEach(spec => {
      const current = Math.max(0, Math.min(spec.max, Math.round(Number(values?.[spec.countControl.key]) || 0)));
      const savedVisibilityMap = values?.__mediaSlotVisibility && typeof values.__mediaSlotVisibility === 'object'
        ? values.__mediaSlotVisibility
        : {};
      const savedVisibility = Array.isArray(savedVisibilityMap[spec.countControl.key])
        ? savedVisibilityMap[spec.countControl.key]
        : null;
      const visibility = Array.from(
        {length:spec.max},
        (_, index) => savedVisibility ? savedVisibility[index] !== false : index < current,
      );
      const section = document.createElement('section');
      section.className = 'preview-media-controls';
      section.dataset.mediaCountKey = spec.countControl.key;
      const head = document.createElement('div');
      head.className = 'preview-media-controls__head';
      const title = document.createElement('strong');
      title.textContent = window.__deckI18n.ui('图片设置');
      const hint = document.createElement('span');
      hint.textContent = window.__deckI18n.ui('全部关闭时自动切换为无媒体布局；打开后可在画布中上传并裁切。');
      head.appendChild(title);
      head.appendChild(hint);
      section.appendChild(head);
      for(let index = 0; index < spec.max; index += 1){
        const visible = visibility[index];
        const row = document.createElement('div');
        row.className = 'preview-media-slot-row';
        row.dataset.mediaSlotIndex = String(index);
        const label = document.createElement('span');
        label.textContent = window.__deckI18n.ui('图片 {n}', {n:index + 1});
        const choice = document.createElement('div');
        choice.className = 'preview-media-slot-choice';
        choice.setAttribute('role', 'group');
        choice.setAttribute('aria-label', label.textContent);
        [
          {value:false, label:window.__deckI18n.ui('不显示')},
          {value:true, label:window.__deckI18n.ui('显示图片')},
        ].forEach(item => {
          const button = document.createElement('button');
          button.type = 'button';
          button.dataset.visible = String(item.value);
          button.textContent = item.label;
          button.classList.toggle('is-active', item.value === visible);
          button.setAttribute('aria-pressed', item.value === visible ? 'true' : 'false');
          makePreviewControlKeyboardNeutral(button);
          button.addEventListener('click', () => {
            const nextVisibility = [...visibility];
            nextVisibility[index] = item.value;
            const nextCount = nextVisibility.reduce(
              (max, isVisible, slotIndex) => isVisible ? slotIndex + 1 : max,
              0,
            );
            updateCurrentProp(spec.countControl, nextCount, {
              extra:{
                __mediaSlotVisibility:{
                  ...savedVisibilityMap,
                  [spec.countControl.key]:nextVisibility,
                },
              },
            });
            releasePreviewControlFocus(button);
          });
          choice.appendChild(button);
        });
        row.appendChild(label);
        row.appendChild(choice);
        section.appendChild(row);
      }
      target.appendChild(section);
    });
  }

  function renderPropControls(opts = {}){
    if(!propsField || !propsPanel) return;
    if(previewPanelView === 'data'){
      renderChartDataEditor(opts);
      return;
    }
    if(renderingPropControls){
      pendingPropControlsSkipApply = pendingPropControlsRender
        ? pendingPropControlsSkipApply && Boolean(opts.skipApply)
        : Boolean(opts.skipApply);
      pendingPropControlsRender = true;
      return;
    }
    renderingPropControls = true;
    try {
    const root = getCurrentPropRoot();
    const controls = orderPropControlsForPanel(parsePropControls(root), root);
    const mediaSettings = document.getElementById('preview-media-settings');
    mediaSettings?.replaceChildren();
    if(!root || !controls.length){
      propsField.classList.add('is-hidden');
      propsPanel.replaceChildren();
      return;
    }
    const slide = getCurrentSlide();
    const values = getSlidePropValues(slide);
    const selectedTextTarget = getSelectedTypographyTarget(slide);
    values.editorTextScale = selectedTextTarget
      ? getTypographyTargetScale(values, selectedTypographyTargetId)
      : 100;
    values.editorFontFamily = selectedTextTarget
      ? getTypographyTargetFont(values, selectedTypographyTargetId)
      : 'theme';
    values.editorTextColor = selectedTextTarget
      ? getTypographyTargetColor(values, selectedTypographyTargetId)
      : '';
    const imageVisibilitySpecs = getImageVisibilitySpecs(controls, values);
    const imageListCountKeys = new Set(imageVisibilitySpecs.map(spec => spec.countControl.key));
    const imageListControlKeys = new Set(imageVisibilitySpecs.map(spec => spec.imageControl.key));
    propsField.classList.remove('is-hidden');
    const nextPanel = document.createDocumentFragment();
    const targetStatus = document.createElement('div');
    targetStatus.className = 'preview-text-target-status';
    const targetCopy = document.createElement('div');
    const targetTitle = document.createElement('strong');
    if(selectedTextTarget) targetTitle.setAttribute('data-i18n-ignore','true');
    targetTitle.textContent = selectedTextTarget
      ? typographyTargetLabel(selectedTextTarget)
      : window.__deckI18n.ui('未选择文字');
    const targetHint = document.createElement('span');
    targetHint.textContent = selectedTextTarget
      ? window.__deckI18n.ui('字号、颜色和字体仅作用于此文字')
      : window.__deckI18n.ui('请在幻灯片中点击需要调整的文字');
    targetCopy.appendChild(targetTitle);
    targetCopy.appendChild(targetHint);
    targetStatus.appendChild(targetCopy);
    if(selectedTextTarget){
      const resetTarget = document.createElement('button');
      resetTarget.type = 'button';
      resetTarget.textContent = window.__deckI18n.ui('恢复字号');
      resetTarget.setAttribute('aria-label', window.__deckI18n.ui('恢复所选文字默认字号'));
      makePreviewControlKeyboardNeutral(resetTarget);
      resetTarget.addEventListener('click', () => {
        updateSelectedTypographyScale(100);
        renderPropControls({skipApply:true});
        releasePreviewControlFocus(resetTarget);
      });
      targetStatus.appendChild(resetTarget);
    }
    nextPanel.appendChild(targetStatus);
    if(selectedTextTarget){
      const widthRow = document.createElement('label');
      widthRow.className = 'preview-text-width';
      widthRow.style.cssText = 'display:flex;align-items:center;gap:8px;margin:8px 0 12px;font-size:12px;';
      widthRow.append(document.createTextNode(window.__deckI18n.ui('文字宽度')));
      const widthInput = document.createElement('input');
      widthInput.type = 'number'; widthInput.min = '120'; widthInput.max = '1400'; widthInput.step = '10';
      const computedWidth = Number.parseFloat(getComputedStyle(selectedTextTarget).maxWidth);
      const currentWidth = Number(getSelectedTypographyStyle(values).maxWidth) || (Number.isFinite(computedWidth) ? Math.round(computedWidth) : Math.round(selectedTextTarget.getBoundingClientRect().width));
      widthInput.value = String(Math.max(120, Math.min(1400, currentWidth || 120)));
      widthInput.setAttribute('aria-label', window.__deckI18n.ui('文字宽度'));
      makePreviewControlKeyboardNeutral(widthInput);
      widthInput.addEventListener('change', () => updateSelectedTypographyMaxWidth(widthInput.value));
      const autoWidth = document.createElement('button');
      autoWidth.type = 'button';
      autoWidth.textContent = window.__deckI18n.ui('恢复自适应');
      makePreviewControlKeyboardNeutral(autoWidth);
      autoWidth.addEventListener('click', () => { updateSelectedTypographyMaxWidth(null); renderPropControls({ skipApply: true }); releasePreviewControlFocus(autoWidth); });
      widthRow.append(widthInput, autoWidth);
      nextPanel.appendChild(widthRow);
    }
    renderShapeControlSection(nextPanel, slide, values);
    renderImageVisibilityControls(mediaSettings || nextPanel, imageVisibilitySpecs, values);
    controls.forEach(control => {
      if(imageListControlKeys.has(control.key) || imageListCountKeys.has(control.key)) return;
      const proxyControl = getImageListCountProxyControl(control, controls);
      if(!proxyControl && (imageListCountKeys.has(control.key) || isHiddenPropControl(control))) return;
      const renderControl = proxyControl || control;
      if(!shouldRenderPropControl(renderControl, values)) return;
      const row = document.createElement('div');
      row.className = 'preview-prop-row';
      const controlType = proxyControl ? 'range' : normalizePropControlType(renderControl.type, renderControl);
      const isColor = renderControl.display === 'color';
      const label = document.createElement('span');
      label.title = control.label || control.key;
      label.textContent = control.label || control.key;
      row.appendChild(label);
      const needsTextTarget = renderControl.key === 'editorTextScale'
        || renderControl.key === 'editorTextColor'
        || renderControl.key === 'editorFontFamily';
      if(needsTextTarget && !selectedTextTarget) row.classList.add('is-target-disabled');
      if(controlType === 'toggle'){
        const sw = document.createElement('label');
        sw.className = 'pp-switch';
        const input = document.createElement('input');
        input.type = 'checkbox';
        input.checked = !!values[renderControl.key];
        makePreviewControlKeyboardNeutral(input);
        input.addEventListener('change', () => {
          updateCurrentProp(renderControl, input.checked);
          releasePreviewControlFocus(input);

  function resolveRangeMax(control, values, min){
    if(control.maxFromKey){
      const base = Number(values[control.maxFromKey]);
      if(Number.isFinite(base)) return base + Number(control.maxFromKeyOffset ?? 0);
    }
    if(control.maxByKey && control.maxByValue && Object.prototype.hasOwnProperty.call(control.maxByValue, values[control.maxByKey])){
      const mapped = Number(control.maxByValue[values[control.maxByKey]]);
      if(Number.isFinite(mapped)) return mapped;
    }
    const max = Number(control.max ?? 10);
    return Number.isFinite(max) ? max : min;
  }

  function clampNumber(value, min, max){
    if(!Number.isFinite(value)) return min;
    return Math.max(min, Math.min(value, max));
  }

  function normalizePropControlType(type, control = {}){
    if(type === 'native-color') return 'native-color';
    if(control?.display === 'tab' || type === 'segment' || type === 'selection' || type === 'select' || type === 'color'){
      const optionCount = propOptions(control).length;
      if(control?.display !== 'color' && optionCount > 0 && optionCount <= (type === 'segment' ? 8 : 5)) return 'segment';
      return 'select';
    }
    if(type === 'icons') return 'icons';
    if(type === 'text' || type === 'string' || type === 'input' || type === 'url' || type === 'email') return 'text';
    if(type === 'textarea' || type === 'multiline') return 'textarea';
    if(type === 'images') return 'image-list';
    if(type === 'image' || type === 'media' || type === 'picture') return 'image';
    if(type === 'list' || type === 'array' || type === 'object') return 'list';
    return type || 'range';
  }

  function formatTickValue(value){
    return Number.isInteger(value) ? String(value) : String(Math.round(value * 100) / 100);
  }

  function normalizePreviewCountButtonLimit(value){
    const numeric = Number(value ?? DEFAULT_PREVIEW_COUNT_BUTTON_LIMIT);
    return Number.isInteger(numeric) && numeric >= 0 ? numeric : DEFAULT_PREVIEW_COUNT_BUTTON_LIMIT;
  }

  function getCountButtonValues(control, min, max, step){
    if(!isImageCountControl(control)) return [];
    if(!Number.isInteger(step) || step < 1 || !Number.isInteger(min) || !Number.isInteger(max) || max < min) return [];
    const cappedMax = Math.min(max, previewCountButtonLimit);
    const values = [];
    for(let value = min; value <= cappedMax; value += step){
      values.push(value);
    }
    return values;
  }

  function isImageCountControl(control){
    const key = String(control?.publicKey || control?.key || '');
    const label = [control?.label, control?.desc].filter(Boolean).join(' ');
    if(/^(image|images|media|photo|photos|picture|pictures|logo|logos|thumb|thumbs|avatar|avatars|frame|frames)(Slot)?Count$/i.test(key)) return true;
    if(/^(image|media|photo|picture|logo|thumb|avatar|frame).*Count$/i.test(key)) return true;
    return /(图片|照片|配图|主图|背景图|缩略图|头像|画框|画格|画面|封面|邮票|品牌|Logo)/i.test(label)
      && /(数量|槽|格数|条数|卡数|列数|画框|画格|主图)/i.test(label);
  }

  function getImageListCountProxyControl(control, controls){
    if(normalizePropControlType(control?.type, control) !== 'image-list' || !control?.countKey) return null;
    const countControl = controls.find(item => item?.key === control.countKey);
    if(!countControl) return null;
    return {
      ...countControl,
      label: control.label || countControl.label,
      desc: control.desc || countControl.desc,
    };
  }

  function isHiddenPropControl(control){
    const type = normalizePropControlType(control?.type);
    return type === 'text' || type === 'textarea' || type === 'list' || type === 'image' || type === 'image-list';
  }

  const CHART_DATA_COLLECTION_HINT = /(data|series|dataset|metrics|stats|values|points|bars|segments|shares|ranking|matrix|table|rows|items|stages|timeline|quarters|months|years|companies|categories|labels|indicators|breakdown|distribution|sources|targets|actuals|forecast)/i;
  const CHART_DATA_SCALAR_KEY = /^(value|amount|pct|percent|percentage|score|level|rate|share|total|price|volume|revenue|cost|growth|change|delta|target|actual|baseline|forecast|anchorValue|numLead|numTail)$/i;
  const CHART_DATA_EXCLUDED_KEY = /^(editor|title|subtitle|eyebrow|kicker|headline|body|copy|footer|header|source|note|caption|description)|(?:image|media|photo|picture|icon|logo|avatar|decor|background|theme|accent|color|font|opacity|radius|width|height|gap|padding|margin|offset|rotate|transition|scene|layout|columns?|count|index|mode|type|style|align|position|duration|speed)$/i;
  const CHART_DATA_LEAF_EXCLUDED_KEY = /^(src|url|href|image|media|photo|picture|icon|logo|avatar|color|background|className|renderSlot|blockId|id|key|type|kind|mode|variant)$/i;

  function collectChartDataCollections(values){
    const declared=new Set((window.__dashiChartItems?.contracts(getCurrentSlide()?.dataset.vmLayout,values)||[]).map(s=>s.path.split('.')[0]));
    const entries = Object.entries(values || {}).filter(([key, value]) => {
      if(TYPOGRAPHY_PROP_KEYS.has(key) || CHART_DATA_EXCLUDED_KEY.test(key) || typeof value === 'boolean' || value == null) return false;
      if(Array.isArray(value) || isPlainChartDataObject(value)) return declared.has(key)||hasChartDataNumber(value);
      return CHART_DATA_SCALAR_KEY.test(key) && isChartDataNumber(value);
    });
    const hasCollection = entries.some(([, value]) => Array.isArray(value) || isPlainChartDataObject(value));
    if(hasCollection){
      Object.entries(values || {}).forEach(([key, value]) => {
        if(entries.some(([existing]) => existing === key)) return;
        if(!CHART_DATA_COLLECTION_HINT.test(key) || CHART_DATA_EXCLUDED_KEY.test(key)) return;
        if((Array.isArray(value) || isPlainChartDataObject(value)) && collectChartDataLeaves(value).length) entries.push([key, value]);
      });
    }
    return entries.map(([key, value]) => ({key, value, leaves:collectChartDataLeaves(value)})).filter(item => item.leaves.length);
  }

  function isPlainChartDataObject(value){
    return Boolean(value) && typeof value === 'object' && !Array.isArray(value) && Object.getPrototypeOf(value) === Object.prototype;
  }

  function isChartDataNumber(value){
    if(typeof value === 'number') return Number.isFinite(value);
    if(typeof value !== 'string') return false;
    const normalized = value.trim().replace(/[,%\s]/g, '').replace(/^[¥￥$€£]/, '').replace(/[+x×]$/i, '');
    return normalized !== '' && Number.isFinite(Number(normalized));
  }

  function isStrictChartNumber(value){
    return typeof value === 'number' || (typeof value === 'string' && /^[-+]?(?:\d+\.?\d*|\.\d+)$/.test(value.trim()));
  }

  function hasChartDataNumber(value, depth = 0){
    if(depth > 8) return false;
    if(isChartDataNumber(value)) return true;
    if(Array.isArray(value)) return value.some(item => hasChartDataNumber(item, depth + 1));
    if(isPlainChartDataObject(value)) return Object.entries(value).some(([key, item]) => !CHART_DATA_LEAF_EXCLUDED_KEY.test(key) && hasChartDataNumber(item, depth + 1));
    return false;
  }

  function collectChartDataLeaves(value, path = [], result = [], depth = 0){
    if(depth > 8) return result;
    if(value===null){if(typeof path.at(-1)==='number'||/^(value|amount|val|pct|share|count|mid|total|level|v)$/.test(String(path.at(-1))))result.push({path,value});return result;}
    if(typeof value === 'number' && Number.isFinite(value)){
      result.push({path, value});
      return result;
    }
    if(typeof value === 'string'){
      if(value.length <= 180 || isChartDataNumber(value)) result.push({path, value});
      return result;
    }
    if(Array.isArray(value)){
      value.forEach((item, index) => collectChartDataLeaves(item, [...path, index], result, depth + 1));
      return result;
    }
    if(isPlainChartDataObject(value)){
      Object.entries(value).forEach(([key, item]) => {
        if(!CHART_DATA_LEAF_EXCLUDED_KEY.test(key)) collectChartDataLeaves(item, [...path, key], result, depth + 1);
      });
    }
    return result;
  }

  function chartDataLabel(value){
    const key = String(value ?? '');
    if(key==='chart')return window.__deckI18n.ui('图表');
    const labels = {value:'数值',values:'数值',label:'标签',labels:'标签',name:'名称',category:'类别',categories:'类别',unit:'单位',date:'日期',year:'年份',month:'月份',quarter:'季度',amount:'金额',percent:'占比',percentage:'占比',pct:'占比',share:'份额',growth:'增速',rate:'比率',score:'得分',total:'合计',target:'目标',actual:'实际',baseline:'基准',forecast:'预测',metrics:'核心指标',series:'数据系列',data:'图表数据',rows:'数据行',items:'数据项',points:'数据点',segments:'分项'};
    if(Object.prototype.hasOwnProperty.call(labels, key)) return window.__deckI18n.ui(labels[key]);
    return key.replace(/([a-z0-9])([A-Z])/g, '$1 $2').replace(/[_-]+/g, ' ') || window.__deckI18n.ui('数据');
  }

  function chartDataPathLabel(path){
    if(!path.length) return window.__deckI18n.ui('数值');
    return path.map(segment => typeof segment === 'number' ? String(segment + 1) : chartDataLabel(segment)).join(' · ');
  }

  function setChartDataAtPath(source, path, value){
    if(!path.length) return value;
    const next = cloneHistorySnapshot(source);
    let target = next;
    for(let index = 0; index < path.length - 1; index += 1) target = target[path[index]];
    target[path[path.length - 1]] = value;
    return next;
  }

  function chartDataError(message){const el=propsPanel?.querySelector('#chart-data-error');if(el)el.textContent=message;}
  function changeChartDataItems(spec,remove){
    if(!canEditDeck())return;const slide=getCurrentSlide();if(!slide)return;
    const saved=getSlidePropValues(slide),draft=hwChartDataDrafts.get(slide.dataset.vmSlideId),values=cloneHistorySnapshot(draft?.props||saved);
    if(remove!=null&&!confirm('移除第 '+(remove+1)+' 个数据项？应用后可撤销恢复。'))return;
    try{const next=window.__dashiChartItems.change(values,spec,{remove});hwChartDataDrafts.set(slide.dataset.vmSlideId,{before:draft?.before||cloneHistorySnapshot(saved),props:next,keys:[...new Set([...(draft?.keys||[]),spec.path.split('.')[0],...(spec.countKey?[spec.countKey]:[])])]});renderChartDataEditor();}catch(e){chartDataError(e.message);}
  }
  function updateChartDataValue(collectionKey, path, rawValue, originalValue){
    if(!canEditDeck()) return;
    const slide = getCurrentSlide();
    if(!slide) return;
    const saved = getSlidePropValues(slide);
    const specs=window.__dashiChartItems?.contracts(slide.dataset.vmLayout,saved)||[];
    const batch=specs.some(s=>s.path.split('.')[0]===collectionKey&&s.sum100);
    const draft=hwChartDataDrafts.get(slide.dataset.vmSlideId);
    const values=cloneHistorySnapshot(draft?.props||saved),before=cloneHistorySnapshot(saved);
    let nextValue = rawValue;
    if(typeof originalValue === 'number'||originalValue===null){
      const numericValue = String(rawValue).trim()===''?null:Number(rawValue);
      if(numericValue!==null&&!Number.isFinite(numericValue)) return;
      nextValue = numericValue;
    }
    values[collectionKey] = setChartDataAtPath(values[collectionKey], path, nextValue);
    if(batch||draft||nextValue===null){hwChartDataDrafts.set(slide.dataset.vmSlideId,{before:draft?.before||before,props:values,keys:[...new Set([...(draft?.keys||[]),collectionKey])]});renderChartDataEditor();return;}
    try{window.__dashiChartItems?.validate(slide.dataset.vmLayout,values);}catch(e){chartDataError(e.message);return;}
    if(applyPropValues(slide, values, {unicornRefresh:true}) === false) return;
    pushSlidePropHistory(slide, before, values, `data:${collectionKey}:${path.join('.')}`);
    renderChartDataEditor({skipApply:true});
  }

  function resetChartDataCollection(collectionKey){
    if(!canEditDeck()) return;
    const slide = getCurrentSlide();
    const baseline = chartDataBaselines.get((slide?.dataset.vmSlideId||'')+':'+slide?.dataset.vmLayout)?.[collectionKey];
    if(!slide || baseline === undefined) return;
    const values = getSlidePropValues(slide);
    const before = cloneHistorySnapshot(values);
    values[collectionKey] = cloneHistorySnapshot(baseline);
    hwChartDataDrafts.delete(slide.dataset.vmSlideId);
    if(applyPropValues(slide, values, {unicornRefresh:true})===false)return;
    pushSlidePropHistory(slide, before, values, `data-reset:${collectionKey}`);
    renderChartDataEditor({skipApply:true});
  }

  function shouldRenderPropControl(control, values){
    if(control.dependsOn){
      const actual = values[control.dependsOn];
      if(Object.prototype.hasOwnProperty.call(control, 'dependsOnValue')){
        if(String(actual) !== String(control.dependsOnValue)) return false;
      } else if(Array.isArray(control.dependsOnValues)){
        if(!control.dependsOnValues.map(String).includes(String(actual))) return false;
      } else if(!actual) return false;
    }
    if(control.countKey && control.countIndex !== undefined){
      const count = Number(values[control.countKey]);
      const index = Number(control.countIndex);
      if(Number.isFinite(count) && Number.isFinite(index) && index >= count) return false;
    }
    return true;
  }

  const EMPHASIS_INDEX_CONTROL_KEYS = new Set(['activeIndex', 'currentIndex', 'emphasisIndex', 'featureIndex', 'focusCol', 'focusIndex', 'highlightCol', 'highlightIndex', 'highlightRowIndex']);

  function isEmphasisIndexControl(control){
    return EMPHASIS_INDEX_CONTROL_KEYS.has(control?.key);
  }

  function resolveEmphasisLinkedMax(control, linkedValue, min){
    const explicitOffset = Number(control?.maxFromKeyOffset);
    const offset = Number.isFinite(explicitOffset) ? explicitOffset : (min === 0 ? -1 : 0);
    return Math.max(min, linkedValue + offset);
  }

  function resolveRangeBounds(control, values){
    const displayOffset = Number(control.displayOffset ?? 0);
    const rawMin = Number(control.min ?? 0);
    let rawMax = resolveRangeMax(control, values, rawMin);
    if(control.maxFromKey && isEmphasisIndexControl(control)){
      const linkedValue = Number(values?.[control.maxFromKey]);
      if(Number.isFinite(linkedValue)){
        rawMax = Math.min(rawMax, resolveEmphasisLinkedMax(control, linkedValue, rawMin));
      }
    }
    if(control.countKey && control.countIndex !== undefined){
      const count = Number(values?.[control.countKey]);
      if(Number.isFinite(count)){
        rawMax = Math.min(rawMax, Math.max(rawMin, count - 1));
      }
    }
    if(rawMax < rawMin) rawMax = rawMin;
    return {
      rawMin,
      rawMax,
      displayOffset,
      min: rawMin + displayOffset,
      max: rawMax + displayOffset,
    };
  }

  function restoreSlidePropSnapshot(slideId, snapshot){
    const slide = [...document.querySelectorAll('#deck > .slide')].find(item => item.dataset.vmSlideId === slideId);
    if(!slide) return;
    const next = cloneHistorySnapshot(snapshot);
    const editorTextStyles = normalizeEditorTextStyles(next.editorTextStyles);
    typographyDrafts.set(slideId, {editorTextStyles});
    slide.dataset.editorTextStyles = JSON.stringify(editorTextStyles);
    slide.dataset.editorShapeStyles = JSON.stringify(normalizeEditorShapeStyles(next.editorShapeStyles));

  function pushSlidePropHistory(slide, before, after, key, opts = {}){
    if(!slide || window.__dashiUndo?.applying) return;
    const previous = cloneHistorySnapshot(before);
    const next = cloneHistorySnapshot(after);
    const stable=value=>Array.isArray(value)?value.map(stable):value&&typeof value==='object'?Object.fromEntries(Object.keys(value).sort().map(key=>[key,stable(value[key])])):value;
    if(JSON.stringify(stable(previous)) === JSON.stringify(stable(next))) return;
    const slideId = slide.dataset.vmSlideId;
    window.__dashiUndo?.push?.({
      label:`prop:${key}`,
      mergeKey:opts.coalesce ? `prop:${slideId}:${key}` : '',
      undo:() => restoreSlidePropSnapshot(slideId, previous),
      redo:() => restoreSlidePropSnapshot(slideId, next),
    });
  }

  function updateCurrentProp(control, value, opts = {}){
    if(!canEditDeck()) return;
    const slide = getCurrentSlide();
    if(!slide) return;
    if(control.key === 'editorTextScale' || control.key === 'editorTextColor' || control.key === 'editorFontFamily'){
      if(control.key === 'editorTextScale') updateSelectedTypographyScale(value, opts);
      else if(control.key === 'editorTextColor') updateSelectedTypographyColor(value, opts);
      else updateSelectedTypographyFont(value, opts);
      if(opts.render !== false) renderPropControls({skipApply:true});
      return;
    }
    let values = cloneHistorySnapshot(getSlidePropValues(slide));
    if(control.key === 'variant'||control.key==='editorStepCount'){
      try{values=window.__snapshotHwTemplateProps?.(slide,values)||values;}catch(error){window.__showHwError?.(error);renderPropControls({skipApply:true});return false;}
    }
    const before = cloneHistorySnapshot(values);
    values[control.key] = coercePropValue(control, value);
    if(control.key==='variant'&&slide.querySelector('[data-native-hw]')){
      try{const resized=window.__prepareHwVariantSwitch?.(slide,before,values.variant);if(resized===false){renderPropControls({skipApply:true});return false;}if(resized)values={...resized,...(opts.extra||{})};}catch(error){window.__showHwError?.(error);renderPropControls({skipApply:true});return false;}
    }
    if(control.key==='editorStepCount'&&slide.querySelector('[data-native-hw]')){
      try{const resized=window.__prepareHwStepCount?.(slide,before,Number(value));if(resized===false){renderPropControls({skipApply:true});return false;}if(resized)values=resized;}catch(error){window.__showHwError?.(error);renderPropControls({skipApply:true});return false;}
    }
    if(control.key==='emphasisIndex'&&slide.querySelector('[data-native-hw]'))values.emphasisMode=Number(values[control.key])<0?'none':'manual';
    if(normalizePropControlType(control.type, control) === 'range'){
      const bounds = resolveRangeBounds(control, values);
      const numericValue = Number(values[control.key]);
      if(Number.isFinite(numericValue)){
        values[control.key] = Math.min(bounds.rawMax, Math.max(bounds.rawMin, numericValue));
      }
    }
    Object.assign(values, opts.extra || {});
    const unicornRefresh = control.key === 'backgroundMode' || control.key === 'unicornScene';
    const applied = applyPropValues(slide, values, {unicornRefresh});
    if(applied === false){if(control.key==='variant')window.__offerHwVariantAdaptation?.(slide,String(value));renderPropControls({skipApply:true});return false;}
    pushSlidePropHistory(slide, before, applied || values, control.key, opts);
    if(opts.render !== false) renderPropControls({skipApply:true});
    return true;
  }

  function localizedPropOptionLabel(label, value, index = 0){
    const i18n = window.__deckI18n;
    if(value == null || label == null) return i18n?.isEn ? 'Hidden' : '隐藏';
    const raw = String(label).trim();
    const valueText = String(value).trim();
    if(/^#[0-9a-f]{3,8}$/i.test(valueText) && raw === valueText) return i18n?.isEn ? `Color ${index + 1}` : `颜色 ${index + 1}`;
    if(i18n?.isEn){
      // metadata 中文选项名查词典;本就是英文的值保持原样(仅首字母大写),
      // ENGLISH_PROP_OPTION_LABELS(英→中)在 en 下不参与。
      if(/[一-鿿]/.test(raw)) return i18n.meta(raw);
      return raw.charAt(0).toUpperCase() + raw.slice(1);
    }
    const labels = ENGLISH_PROP_OPTION_LABELS || {};
    const exact = labels[raw.toLowerCase()] || labels[valueText.toLowerCase()];
    if(exact && (raw === valueText || /^[A-Za-z0-9_./ -]+$/.test(raw))) return exact;
    return raw.replace(/\bYES\b/g, '是').replace(/\bNO\b/g, '否').replace(/\b8-bit\b/gi, '像素');
  }

  function paletteSwatchBackground(colors){
    const count = Math.max(1, colors.length);
    if(count === 1) return colors[0];

    if(!slide) return;

    if(!root) return;
    let next = {...parsePropDefaults(root), ...getSlideSourceProps(slide), ...(values || {})};
    try{next=window.__normalizeHwTemplateProps?.(slide,next)||next;window.__dashiChartItems?.validate(slide.dataset.vmLayout,next);window.__validateHwTemplate?.(slide,next);}catch(error){window.__showHwError?.(error);return false;}
    window.__dashiChartItems?.prepareText(slide,getSlidePropValues(slide),next);
    if(opts.persist !== false) viewModel?.setProps?.(slide.dataset.vmSlideId, next);
    if(opts.persist !== false) window.__markOverviewThumbDirty?.(slide);
    if(opts.unicornRefresh){
      slide.querySelectorAll('.bt-unicorn-frame').forEach(frame => window.__resetUnicornSceneFrame?.(frame));
    }
    const runtimeNext = {...next};
    TYPOGRAPHY_PROP_KEYS.forEach(key => delete runtimeNext[key]);
    if(window.__renderHwTemplate?.(slide, runtimeNext)||window.__renderNativeIcons?.(slide, runtimeNext)||window.__renderNativeChart?.(slide, runtimeNext)||window.__renderRuntimeSlide?.(slide, runtimeNext)){
      window.__initEditableText?.(slide);
      // A control-panel tweak re-renders the already-active slide in place —
      // not a slide entry/transition. `skipMotion` avoids replaying theme10's
      // JS-driven entrance stagger (playTheme10Motion) on every prop change;
      // other themes' pure-CSS entrance already only fires once on mount, so
      // this is a no-op for them.
      window.__syncActiveEffects?.(slide, {skipMotion:true});
      requestAnimationFrame(() => window.__initUnicornScenes?.(slide, {force:true}));
    }
    window.__renderConsoleCanvas?.(slide,next);
    syncIndependentMediaSlotVisibility(slide, next);
    requestAnimationFrame(() => syncIndependentMediaSlotVisibility(slide, next));
    applyTypographyOverrides(slide, next);
    applyShapeOverrides(slide, next);
    return next;
  }

  function setEditorPanelsCollapsed(collapsed){
    const next = Boolean(collapsed);
    document.body.classList.toggle('editor-panels-collapsed', next);
    document.body.classList.toggle('preview-panel-open', !next);
    syncEditorPanelState();
    window.__setEditableTextMode?.(canEditDeck());
    scheduleShapeOverlayUpdate();
    requestEditorShellLayout();
  }

  function syncEditorPanelState(){
    const collapsed = document.body.classList.contains('editor-panels-collapsed');
    panel.setAttribute('aria-hidden', collapsed ? 'true' : 'false');
    slideRail?.setAttribute('aria-hidden', collapsed ? 'true' : 'false');
    if(isEditMode()){
      panel.inert = collapsed;
      if(slideRail) slideRail.inert = collapsed;
    }
    if(panelCollapse){
      const label = window.__deckI18n.ui(collapsed ? '展开面板' : '收起面板');
      panelCollapse.classList.toggle('is-collapsed', collapsed);
      panelCollapse.setAttribute('aria-expanded', collapsed ? 'false' : 'true');
      panelCollapse.setAttribute('aria-label', label);
      panelCollapse.setAttribute('title', label);

  }

  function requestEditorShellLayout(){
    requestAnimationFrame(() => {
      window.__layoutDeck?.();
      window.__fitOverviewThumbnails?.();
    });
  }
  window.__setEditorPanelsCollapsed = setEditorPanelsCollapsed;
  window.__getEditorPanelsCollapsed = () => document.body.classList.contains('editor-panels-collapsed');

  panel.addEventListener('mousedown', e => e.stopPropagation());
  panelCollapse?.addEventListener('mousedown', e => e.stopPropagation());
  panelCollapse?.addEventListener('click', () => setEditorPanelsCollapsed(!document.body.classList.contains('editor-panels-collapsed')));
  document.getElementById('preview-present-btn')?.addEventListener('click', () => window.__enterPresentMode?.());
  syncEditorPanelState();
  window.__setEditableTextMode?.(canEditDeck());
  requestEditorShellLayout();

  // merged export dropdown
  const exportWrap = document.getElementById('preview-export-wrap');
  const exportMain = document.getElementById('preview-export-main');
  const setExportOpen = (open) => {
    exportWrap?.classList.toggle('open', open);
    exportMain?.setAttribute('aria-expanded', open ? 'true' : 'false');
  };
  exportMain?.addEventListener('click', e => {
    e.stopPropagation();
    setExportOpen(!exportWrap.classList.contains('open'));
  });
  document.addEventListener('click', e => {
    if(exportWrap && !exportWrap.contains(e.target)) setExportOpen(false);
  });
  document.getElementById('preview-export')?.addEventListener('click', () => { setExportOpen(false); clearTypographySelection({render:false}); clearShapeSelection({render:false}); applyAllTypographyOverrides(); applyAllShapeOverrides(); window.__exportDeckHtml?.(); });
  document.getElementById('preview-export-pdf')?.addEventListener('click', () => { setExportOpen(false); clearTypographySelection({render:false}); clearShapeSelection({render:false}); applyAllTypographyOverrides(); applyAllShapeOverrides(); window.__exportDeckPdf?.(); });
  document.getElementById('preview-export-pptx')?.addEventListener('click', () => { setExportOpen(false); clearTypographySelection({render:false}); clearShapeSelection({render:false}); applyAllTypographyOverrides(); applyAllShapeOverrides(); window.__exportDeckPptx?.(); });
  document.getElementById('preview-reset')?.addEventListener('click', () => {
    localStorage.removeItem(STORE);
    Object.keys(localStorage).filter(key => key.startsWith(`${STORE}:`)).forEach(key => localStorage.removeItem(key));
    localStorage.removeItem('dashi-ppt-view-model');
    Object.keys(localStorage).filter(key => key.startsWith('dashi-ppt-current-slide:')).forEach(key => localStorage.removeItem(key));
    location.reload();
  });

  function getCurrentSlide(){
    if(!deckSlides.length) deckSlides = readPreviewDeckSlides();
    const index = window.__currentSlideIndex || 0;
    return deckSlides[index] || null;
  }
})();

<script>
/* =============== Static HTML Export =============== */
(function(){
  const deck = document.getElementById('deck');
  if(!deck) return;
  window.__deckExportLocked = false;

  const vendorScriptPromises = new Map();
  function ensureVendorScript(src, readyCheck){
    if(readyCheck?.()) return Promise.resolve();
    if(vendorScriptPromises.has(src)) return vendorScriptPromises.get(src);
    const promise = new Promise((resolve, reject) => {
      const script = document.createElement('script');
      script.src = src;
      script.onload = () => resolve();
      script.onerror = () => { vendorScriptPromises.delete(src); reject(new Error(window.__deckI18n.ui('无法加载组件 {src}', {src: src}))); };
      document.head.appendChild(script);
    });
    vendorScriptPromises.set(src, promise);
    return promise;
  }
  function ensureHtmlToImageLoaded(){
    return ensureVendorScript('assets/vendor/html-to-image.js', () => window.htmlToImage);
  }

  async function waitForSlideMediaReadyForCapture(root){
    const images = [...root.querySelectorAll('img')].filter(img => { const r = img.getBoundingClientRect(); return r.width > 1 && r.height > 1 && !img.complete; });
    if(!images.length) return;
    await Promise.race([
      Promise.all(images.map(img => new Promise(resolve => { img.addEventListener('load', resolve, { once: true }); img.addEventListener('error', resolve, { once: true }); }))),
      new Promise(resolve => setTimeout(resolve, 4000)),
    ]);
  }

  function finishSlideAnimationsForCapture(root){
    (root.getAnimations?.({ subtree: true }) || []).forEach(animation => {
      try {
        const timing = animation.effect?.getComputedTiming?.();
        const endTime = Number(timing?.endTime);
        if(Number.isFinite(endTime) && endTime > 0) animation.finish();
        else animation.pause();
      } catch {}
    });
    try {
      (window.gsap?.globalTimeline?.getChildren?.(true, true, true) || []).forEach(tween => {
        const targets = typeof tween.targets === 'function' ? tween.targets() : [];
        if(!targets.some(target => target instanceof Node && root.contains(target))) return;
        const duration = Number(tween.totalDuration?.());
        if(Number.isFinite(duration) && duration > 0) tween.progress?.(1);
        tween.pause?.();
      });
    } catch {}
  }

  async function assemblePdfInBrowser(pages, title){
    await ensureVendorScript('assets/vendor/pdf-lib.min.js', () => window.PDFLib?.PDFDocument);
    const { PDFDocument } = window.PDFLib;
    const pdf = await PDFDocument.create();
    pdf.setTitle(title || 'Deck PDF Export');
    pdf.setAuthor('DashiAI PPT');
    pdf.setSubject('Browser-captured PDF export');
    const PDF_W = 16 * 72, PDF_H = 9 * 72;
    for(const dataUrl of pages){
      const base64 = String(dataUrl || '').split(',')[1] || '';
      const bytes = Uint8Array.from(atob(base64), c => c.charCodeAt(0));
      const image = /^data:image\/png/i.test(dataUrl) ? await pdf.embedPng(bytes) : await pdf.embedJpg(bytes);
      const page = pdf.addPage([PDF_W, PDF_H]);
      page.drawImage(image, { x: 0, y: 0, width: PDF_W, height: PDF_H });
    }
    const out = await pdf.save();
    return new Blob([out], { type: 'application/pdf' });
  }

  async function captureDeckPagesInBrowser(exportUi){
    await ensureHtmlToImageLoaded();
    const slides = window.__getVisibleSlides?.() || [...document.querySelectorAll('#deck > .slide:not([hidden])')];
    if(!slides.length) throw new Error(window.__deckI18n.ui('没有可导出的页面。'));
    const originalIndex = Math.max(0, slides.findIndex(slide => slide.classList.contains('active')));
    const waitFrame = () => new Promise(resolve => requestAnimationFrame(resolve));
    const pages = [];
    try {
      for(let index = 0; index < slides.length; index += 1){
        throwIfDeckExportCancelled(exportUi);
        updateDeckExport(exportUi, index, slides.length, window.__deckI18n.ui('浏览器内截取第 {current}/{total} 页...', {current: index + 1, total: slides.length}));
        window.go?.(index, { animate: false, force: true });
        await waitFrame(); await waitFrame();
        const slide = slides[index];
        slides.forEach((item, slideIndex) => {
          const active = slideIndex === index;
          item.classList.toggle('active', active);
          if(active) item.setAttribute('data-deck-active', '');
          else item.removeAttribute('data-deck-active');
        });
        window.__ensureRuntimeSlideRendered?.(slide);
        window.__restoreEffectIframes?.(slide);
        window.__syncDeckPageNumbers?.(slide);
        window.__layoutDeck?.();
        window.__initUnicornScenes?.(slide, { force: true });
        if(document.fonts?.ready) await Promise.race([document.fonts.ready.catch(() => {}), new Promise(resolve => setTimeout(resolve, 2500))]);
        await waitForSlideMediaReadyForCapture(slide);
        finishSlideAnimationsForCapture(slide);
        await waitFrame(); await waitFrame();
        const capture = window.htmlToImage.toJpeg(slide, withSlideCaptureFilter({ quality: 0.92, pixelRatio: 1.5, backgroundColor: '#000000' }));
        const timeout = new Promise((_, reject) => setTimeout(() => reject(new Error(window.__deckI18n.ui('第 {n} 页截图超时', {n: index + 1}))), 30000));
        pages.push(await Promise.race([capture, timeout]));
      }
    } finally {
      window.go?.(originalIndex, { animate: false, force: true });
      window.__syncActiveEffects?.();
    }
    return pages;
  }

  // 浏览器内 PDF 导出:服务器在沙箱型宿主(如豆包)里无法启动导出浏览器时的兜底——
  // 截图发生在用户自己打开预览页的浏览器(正常桌面进程,不受宿主沙箱影响),
  // 服务器只用 pdf-lib 做纯 JS 合成。可手动调用,也由 __exportDeckPdf 自动降级触发。
  async function runBrowserPptxExportInFrame(options){
    const frame = document.createElement('iframe');
    frame.style.cssText = 'position:fixed;left:-20020px;top:0;width:1920px;height:1080px;border:0;visibility:hidden;pointer-events:none';
    frame.setAttribute('aria-hidden', 'true');
    frame.src = location.pathname + location.search;
    document.body.appendChild(frame);
    try {
      await new Promise((resolve, reject) => {
        const timer = setTimeout(() => reject(new Error(window.__deckI18n.ui('导出环境加载超时'))), 30000);
        frame.onload = () => { clearTimeout(timer); resolve(); };
        frame.onerror = () => { clearTimeout(timer); reject(new Error(window.__deckI18n.ui('导出环境加载失败'))); };
      });
      const win = frame.contentWindow;
      const doc = frame.contentDocument;
      // 等 iframe 内 deck 就绪
      await new Promise((resolve, reject) => {
        const deadline = Date.now() + 30000;
        (function poll(){
          if(doc.querySelector('#deck > .slide.active') && typeof win.go === 'function') return resolve();
          if(Date.now() > deadline) return reject(new Error(window.__deckI18n.ui('导出环境的页面未就绪')));
          setTimeout(poll, 120);
        })();
      });
      // 注入导出组件
      for(const [src, ready] of [
        ['assets/vendor/html-to-image.js', () => win.htmlToImage],
        ['assets/vendor/pptxgen.bundle.js', () => typeof win.PptxGenJS === 'function'],
        ['assets/vendor/editable-pptx-browser.js', () => win.__editablePptxBrowser?.exportEditablePptxInBrowser],
      ]){
        if(ready()) continue;
        await new Promise((resolve, reject) => {
          const script = doc.createElement('script');
          script.src = src;
          script.onload = () => resolve();
          script.onerror = () => reject(new Error(window.__deckI18n.ui('无法加载组件 {src}', {src: src})));
          doc.head.appendChild(script);
        });
      }
      return await win.__editablePptxBrowser.exportEditablePptxInBrowser(options);
    } finally {
      frame.remove();
    }
  }

  // 浏览器内可编辑 PPTX 导出:服务器在沙箱型宿主里起不了无头浏览器时的降级——
  // 采集/截图/组装全部在用户当前浏览器完成(assets/vendor/editable-pptx-browser.js),
  // 服务器只负责把成品二进制落盘(/api/export-pptx-store)。可手动调用,也由
  // __exportDeckPptx 自动降级触发。
  window.__exportDeckPptxInBrowser = async function(existingUi){
    if(window.__deckExportLocked && !existingUi) return;
    let exportUi = existingUi || null;
    const owns = !exportUi;
    try {
      if(owns) exportUi = beginDeckExport('PPTX');
      updateDeckExport(exportUi, 0, 1, window.__deckI18n.ui('准备浏览器内导出环境...'));
      window.__syncDeckPageNumbers?.();
      window.__flushEditableTextState?.();
      window.__syncDeckViewModelFromDom?.();
      throwIfDeckExportCancelled(exportUi);
      const slides = window.__getVisibleSlides?.() || [...document.querySelectorAll('#deck > .slide:not([hidden])')];
      // 在屏外 1920×1080 iframe 里跑导出:视口与服务端无头浏览器完全一致(deck 缩放
      // 为 1:1,细元素不会被视口阈值过滤),同时不打断用户正在看的页面;当前的编辑
      // 状态经 snapshot 带入 iframe。
      const { blob, report } = await runBrowserPptxExportInFrame({
        snapshot: buildEditablePptxExportSnapshot(),
        title: document.title || 'Presentation',
        onProgress: update => {
          if(!update?.detail) return;
          const percent = Number(update.percent || 0);
          updateDeckExport(exportUi, Math.min(slides.length, Math.round((percent / 100) * slides.length)), slides.length, window.__deckI18n.ui('{detail}(浏览器内导出)', {detail: window.__deckI18n.exportDetail(update.detail)}));
        },
      });
      throwIfDeckExportCancelled(exportUi);
      updateDeckExport(exportUi, slides.length, slides.length, window.__deckI18n.ui('保存 PPTX...'));
      const downloadName = `${getDeckFileName()}.pptx`;
      // 优先经预览服务落盘(产物进 output/exports,可追溯);静态文件服务器(node/python
      // 静态托管)没有该端点——直接把 blob 交给浏览器下载,导出不依赖任何服务端能力。
      let result = null;
      try {
        const response = await fetch(`/api/export-pptx-store?fileName=${encodeURIComponent(getDeckFileName())}`, {
          method: 'POST',
          headers: {'content-type': 'application/octet-stream'},
          body: blob,
        });
        if(response.ok) result = await response.json();
      } catch {}
      if(result?.downloadUrl){
        window.__lastPptxExportResult = { ...result, ...report, downloadStarted: false };
        const downloadStarted = startServerExportDownload(result.downloadUrl, 'PPTX');
        window.__lastPptxExportResult.downloadStarted = downloadStarted;
        updateDeckExport(exportUi, slides.length, slides.length, downloadStarted ? window.__deckI18n.ui('PPTX 已开始下载(浏览器内导出)') : window.__deckI18n.ui('PPTX 已生成：{name}', {name: result.relativePath || result.downloadName || 'download'}));
        if(!downloadStarted) alert(window.__deckI18n.ui('PPTX 已生成：\n{name}', {name: result.downloadName || result.relativePath || 'download'}));
        return result;
      }
      downloadBlob(blob, downloadName);
      result = { ok: true, browserCapture: true, blobDownload: true, downloadName, ...report, downloadStarted: true };
      window.__lastPptxExportResult = result;
      updateDeckExport(exportUi, slides.length, slides.length, window.__deckI18n.ui('PPTX 已开始下载(浏览器内导出)'));
      return result;
    } catch (error) {
      if(isDeckExportCancelledError(error)) return null;
      if(!owns) throw error;
      console.error('[export pptx][browser-capture]', error);
      alert(error?.message || window.__deckI18n.ui('PPTX 浏览器内导出失败,请在浏览器控制台查看错误。'));
      return null;
    } finally {
      if(owns) endDeckExport(exportUi);
      window.__syncActiveEffects?.();
    }
  };

  window.__exportDeckPdfInBrowser = async function(existingUi){
    if(window.__deckExportLocked && !existingUi) return;
    let exportUi = existingUi || null;
    const owns = !exportUi;
    try {
      if(owns) exportUi = beginDeckExport('PDF');
      const pages = await captureDeckPagesInBrowser(exportUi);
      throwIfDeckExportCancelled(exportUi);
      updateDeckExport(exportUi, pages.length, pages.length, window.__deckI18n.ui('合成 PDF...'));
      // 优先经预览服务合成落盘;静态文件服务器没有 assemble 端点——用前端 pdf-lib
      // 在浏览器内合成并直接下载,导出不依赖任何服务端能力。
      let result = null;
      try {
        const response = await fetch('/api/export-pdf-assemble', {
          method: 'POST',
          headers: {'content-type': 'application/json'},
          body: JSON.stringify({ title: document.title || 'Presentation', fileName: getDeckFileName(), pages }),
        });
        if(response.ok) result = await response.json();
      } catch {}
      if(result?.downloadUrl){
        window.__lastPdfExportResult = { ...result, downloadStarted: false };
        const downloadStarted = startServerExportDownload(result.downloadUrl, 'PDF');
        window.__lastPdfExportResult.downloadStarted = downloadStarted;
        updateDeckExport(exportUi, pages.length, pages.length, downloadStarted ? window.__deckI18n.ui('PDF 已开始下载(浏览器内导出)') : window.__deckI18n.ui('PDF 已生成：{name}', {name: result.relativePath || result.downloadName || 'download'}));
        if(!downloadStarted) alert(window.__deckI18n.ui('PDF 已生成：\n{name}', {name: result.downloadName || result.relativePath || 'download'}));
        return result;
      }
      const blob = await assemblePdfInBrowser(pages, document.title || 'Presentation');
      const downloadName = `${getDeckFileName()}.pdf`;
      downloadBlob(blob, downloadName);
      result = { ok: true, browserCapture: true, blobDownload: true, generationMode: 'browser-capture', pages: pages.length, downloadName, downloadStarted: true };
      window.__lastPdfExportResult = result;
      updateDeckExport(exportUi, pages.length, pages.length, window.__deckI18n.ui('PDF 已开始下载(浏览器内导出)'));
      return result;
    } catch (error) {
      if(isDeckExportCancelledError(error)) return null;
      if(!owns) throw error;
      console.error('[export pdf][browser-capture]', error);
      alert(error?.message || window.__deckI18n.ui('PDF 浏览器内导出失败，请在浏览器控制台查看错误。'));
      return null;
    } finally {
      if(owns) endDeckExport(exportUi);
      window.__syncActiveEffects?.();
    }
  };

  window.__exportDeckPdf = async function(){
    if(window.__deckExportLocked) return;
    // Export is HTTP-service only. Opened directly from disk (file://) there is no
    // export service, and a client-side export can't match server fidelity — so we
    // tell the user to use the preview server instead of producing a lesser file.
    if(!isExportServiceContext()) return showExportServiceRequired();
    let exportUi = null;
    let progressPoll = null;
    try {
      exportUi = beginDeckExport('PDF');
      const progressId = createPdfExportProgressId();
      progressPoll = beginPdfExportProgressPolling(exportUi, progressId);
      updateDeckExport(exportUi, 0, 1, window.__deckI18n.ui('提交截图 PDF 生成任务...'));
      window.__syncDeckPageNumbers?.();
      window.__flushEditableTextState?.();
      window.__syncDeckViewModelFromDom?.();
      throwIfDeckExportCancelled(exportUi);
      const slides = window.__getVisibleSlides?.() || [...document.querySelectorAll('#deck > .slide:not([hidden])')];
      let response;
      try {
        response = await fetch('/api/export-pdf', {
          method: 'POST',
          headers: {'content-type': 'application/json'},
          body: JSON.stringify({
            title: document.title || 'Presentation',
            fileName: getDeckFileName(),
            sourcePath: getServerExportSourcePath(),
            progressId,
            snapshot: buildPdfExportSnapshot(),
          }),
        });
      } catch {
        response = null;
      }
      progressPoll.stop();
      progressPoll = null;
      throwIfDeckExportCancelled(exportUi);
      // 地址是 HTTP 但背后没有导出服务(通用静态服务器对 POST 返回 501/405,
      // 路径没被服务的返回 404,服务进程退出则 fetch 直接失败):自 blob 导出支持后,
      // 静态服务器同样可以完成全流程——直接切换浏览器内导出(截图+前端合成+blob 下载)。
      if(!response || [404, 405, 501].includes(response.status)){
        updateDeckExport(exportUi, 0, 1, window.__deckI18n.ui('当前服务无导出端点,切换浏览器内导出...'));
        const fallbackResult = await window.__exportDeckPdfInBrowser(exportUi);
        if(fallbackResult) return;
        showExportServiceRequired('no-service');
        return;
      }
      if(!response.ok){
        let detail = '';
        try { detail = (await response.json())?.error || ''; } catch {}
        // 沙箱型宿主(如豆包)里服务器无法启动导出浏览器(Mach/显示服务被拦):
        // 自动降级为「当前浏览器逐页截图 + 服务器纯 JS 合成」。
        if(response.status === 500 && /browser has been closed|browserType\.launch|Target page, context or browser|Chrome executable not found/i.test(detail)){
          updateDeckExport(exportUi, 0, 1, window.__deckI18n.ui('服务器无法启动导出浏览器,切换浏览器内导出...'));
          const fallbackResult = await window.__exportDeckPdfInBrowser(exportUi);
          if(fallbackResult) return;
        }
        throw new Error(detail || `PDF export endpoint failed (${response.status})`);
      }
      const result = await response.json();
      if(!result?.downloadUrl) throw new Error('PDF export did not return a download URL.');
      window.__lastPdfExportResult = result;
      const downloadStarted = startServerExportDownload(result.downloadUrl, 'PDF');
      window.__lastPdfExportResult.downloadStarted = downloadStarted;
      updateDeckExport(exportUi, slides.length, slides.length, downloadStarted ? window.__deckI18n.ui('PDF 已开始下载') : window.__deckI18n.ui('PDF 已生成：{name}', {name: result.relativePath || result.downloadName || 'download'}));
      if(!downloadStarted) alert(window.__deckI18n.ui('PDF 已生成：\n{name}', {name: result.downloadName || result.relativePath || 'download'}));
    } catch (error) {
      if(isDeckExportCancelledError(error)) return;
      console.error('[export pdf]', error);
      alert(error?.message || window.__deckI18n.ui('PDF 导出失败，请在浏览器控制台查看错误。'));
    } finally {
      progressPoll?.stop?.();
      endDeckExport(exportUi);
      window.__syncActiveEffects?.();
    }
  };

  function createPdfExportProgressId(){
    const random = Math.random().toString(36).slice(2, 10);
    return `pdf-${Date.now().toString(36)}-${random}`;
  }

  window.__exportDeckPptx = async function(){
    if(window.__deckExportLocked) return;
    if(isCodexInAppBrowser()){
      const message = window.__deckI18n.ui('codex 自带浏览器不支持导出，需要复制地址到浏览器再进行操作');
      window.__codexExportBlockedMessage = message;
      alert(message);
      return;
    }
    // Export is HTTP-service only (file:// has no editable-PPTX server, and a
    // client-side export can't match server fidelity).
    if(!isExportServiceContext()) return showExportServiceRequired();
    const button = document.getElementById('preview-export-pptx');
    const buttonLabel = button?.textContent;
    let exportUi = null;
    let progressPoll = null;
    try {
      exportUi = beginDeckExport('PPTX');
      if(button){
        button.disabled = true;
        button.textContent = window.__deckI18n.ui('导出中...');
      }
      updateDeckExport(exportUi, 0, 1, window.__deckI18n.ui('准备页面状态...'));
      window.__syncDeckPageNumbers?.();
      window.__flushEditableTextState?.();
      window.__syncDeckViewModelFromDom?.();
      throwIfDeckExportCancelled(exportUi);

      const slides = window.__getVisibleSlides?.() || [...document.querySelectorAll('#deck > .slide:not([hidden])')];
      const progressId = createEditablePptxProgressId();
      progressPoll = beginEditablePptxProgressPolling(exportUi, progressId);
      updateDeckExport(exportUi, 1, 100, window.__deckI18n.ui('提交可编辑 PPTX 生成任务...'));
      let response;
      try {
        response = await fetch('/api/export-editable-pptx', {
          method: 'POST',
          headers: {'content-type': 'application/json'},
          body: JSON.stringify({
            title: document.title || 'Presentation',
            fileName: getDeckFileName(),
            sourcePath: getServerExportSourcePath(),
            progressId,
            snapshot: buildEditablePptxExportSnapshot(),
          }),
        });
      } catch {
        response = null;
      }
      progressPoll.stop();
      progressPoll = null;
      throwIfDeckExportCancelled(exportUi);
      // 同 PDF:HTTP 地址但没有导出服务(静态服务器 501/405、404、或服务已退出)——
      // 自 blob 导出支持后直接切换浏览器内导出(iframe 采集+组装+blob 下载)。
      if(!response || [404, 405, 501].includes(response.status)){
        updateDeckExport(exportUi, 0, 1, window.__deckI18n.ui('当前服务无导出端点,切换浏览器内导出...'));
        const fallbackResult = await window.__exportDeckPptxInBrowser(exportUi);
        if(fallbackResult) return;
        showExportServiceRequired('no-service');
        return;
      }
      if(!response.ok){
        let detail = '';
        try { detail = (await response.json())?.error || ''; } catch {}
        // 沙箱型宿主里服务器无法启动导出浏览器(Mach/显示服务被拦)或机器无浏览器:
        // 自动降级为「当前浏览器内采集/截图/组装 + 服务器纯落盘」。
        if(response.status === 500 && /browser has been closed|browserType\.launch|Target page, context or browser|Chrome executable not found/i.test(detail)){
          updateDeckExport(exportUi, 0, 1, window.__deckI18n.ui('服务器无法启动导出浏览器,切换浏览器内导出...'));
          const fallbackResult = await window.__exportDeckPptxInBrowser(exportUi);
          if(fallbackResult) return;
        }
        throw new Error(detail || `Editable PPTX export endpoint failed (${response.status})`);
      }
      const result = await response.json();
      if(!result?.downloadUrl) throw new Error('Editable PPTX export did not return a download URL.');
      window.__lastPptxExportResult = result;
      throwIfDeckExportCancelled(exportUi);
      const downloadStarted = startServerExportDownload(result.downloadUrl, 'PPTX');
      window.__lastPptxExportResult.downloadStarted = downloadStarted;
      updateDeckExport(exportUi, slides.length, slides.length, downloadStarted ? window.__deckI18n.ui('PPTX 已开始下载') : window.__deckI18n.ui('PPTX 已生成：{name}', {name: result.relativePath || result.downloadName || 'download'}));
      if(!downloadStarted) alert(window.__deckI18n.ui('PPTX 已生成：\n{name}', {name: result.downloadName || result.relativePath || 'download'}));
    } catch (error) {
      if(isDeckExportCancelledError(error)) return;
      console.error('[export pptx]', error);
      const message = location.protocol === 'http:' || location.protocol === 'https:'
        ? window.__deckI18n.ui('可编辑 PPTX 导出失败：{message}\n\n可以把「帮我导出PPTX」发给 AI,让它重新走导出流程。', {message: error?.message || window.__deckI18n.ui('未知错误')})
        : window.__deckI18n.ui('可编辑 PPTX 导出失败，请通过本地 HTTP/HTTPS 预览服务打开。直接打开本地 HTML/file:// 不能导出可编辑 PPTX。');
      window.__lastPptxExportErrorMessage = message;
      alert(message);
    } finally {
      progressPoll?.stop?.();
      document.body.classList.remove('pptx-export-capturing');
      endDeckExport(exportUi);
      if(button){
        button.disabled = false;
        button.textContent = buttonLabel;
      }
      window.__syncActiveEffects?.();
    }
  };

  function createEditablePptxProgressId(){

  function isCodexInAppBrowser(){

      .map(item => `${item.brand || ''} ${item.version || ''}`)
      .join(' ');
    return /\b(CodexBrowser|OpenAI Codex|Codex Desktop|ChatGPT-Codex)\b/i.test(`${ua} ${brands}`);

  function buildEditablePptxExportSnapshot(){

      themePack: document.documentElement.dataset.themePack || '',

  // 导出走 snapshot(见 buildPdfExportSnapshot / collectEditablePptxCanvasSnapshots)把当前主题包/
  // 页面/编辑状态整份带给服务端,sourcePath 只用来定位要打开的 HTML 文件——不需要,也不应该带上
  // 任何查询参数(轻量视图定位参数也不例外),避免污染导出产物。
  function getServerExportSourcePath() {
    return new URL(location.href).pathname;

  function startServerExportDownload(downloadUrl, exportType){
    if(!downloadUrl) return false;
    try {
      const url = new URL(downloadUrl, location.href);
      if(url.origin !== location.origin) return false;
      const file = url.searchParams.get('file') || '';
      const expected = exportType === 'PDF'
        ? {path:'/api/export-pdf-download', ext:'.pdf'}
        : exportType === 'PPTX'
          ? {path:'/api/export-editable-pptx-download', ext:'.pptx'}
          : null;
      if(!expected) return false;
      if(url.pathname !== expected.path) return false;
      if(!file.toLowerCase().endsWith(expected.ext)) return false;
      location.assign(url.href);
      return true;
    } catch {
      return false;
    }
  }

  function collectEditablePptxCanvasSnapshots(){
    const slides = window.__getVisibleSlides?.() || [...document.querySelectorAll('#deck > .slide:not([hidden])')];
    const out = [];
    slides.forEach((slide, slideIndex) => {
      const slideRect = slide.getBoundingClientRect();
      if(!slideRect.width || !slideRect.height) return;
      slide.querySelectorAll('canvas').forEach((canvas, canvasIndex) => {
        if(canvas.closest('.bt-unicorn-frame')) return;
        const style = getComputedStyle(canvas);
        const rect = canvas.getBoundingClientRect();
        if(style.display === 'none' || style.visibility === 'hidden' || Number(style.opacity || 1) <= 0.01) return;
        if(rect.width <= 1 || rect.height <= 1) return;
        try {
          const data = canvas.toDataURL('image/png');
          out.push({
            slideIndex,
            canvasIndex,
            data,
            left: (rect.left - slideRect.left) / slideRect.width * 100,
            top: (rect.top - slideRect.top) / slideRect.height * 100,
            width: rect.width / slideRect.width * 100,
            height: rect.height / slideRect.height * 100,
          });
        } catch {}
      });
    });
    return out;
  }

  function materializeHtmlExportViewModel(clone, visibleSlides){
    const vmEl = clone.querySelector('#deck-view-model');
    if(!vmEl || !window.__deckViewModel?.model) return;
    const liveModel = window.__deckViewModel.model;
    const state = liveModel.state || {};
    const sourceSlides = new Map((liveModel.slides || []).map(slide => [slide.id, slide]));
    const slides = (visibleSlides || []).map(slide => {

      return {
        ...source,
        props: {
          ...(source.props || {}),

        },

    const model = {
      ...liveModel,
      exportId: 'html-' + Date.now().toString(36) + '-' + Math.random().toString(36).slice(2, 8),
      slides,
      state: {
        ...(state || {}),
        slideOrder: slideIds,
        skippedSlides: [],
        deletedSlides: [],
        props: {},
      },
    };
    vmEl.textContent = JSON.stringify(model).replace(/</g, '\\u003c');
    const textEl = clone.querySelector('#embedded-text-state');
    if(textEl) textEl.textContent = JSON.stringify(state.text || {}).replace(/</g, '\\u003c');

  function pruneHiddenSlidesForHtmlExport(clone, visibleSlides){
    const visibleIds = new Set((visibleSlides || []).map((slide, index) => getCloneSlideKey(slide, index)).filter(Boolean));
    if(!visibleIds.size) return;
    clone.querySelectorAll('#deck > .slide').forEach((slide, index) => {
      if(!visibleIds.has(getCloneSlideKey(slide, index))){
        slide.remove();
        return;
      }
      slide.hidden = false;
      slide.removeAttribute('hidden');
      slide.removeAttribute('aria-hidden');
      slide.removeAttribute('data-slide-skipped');
    });

  function getCloneSlideKey(slide, index){
    return slide?.dataset?.vmSlideId || slide?.dataset?.vmLayout || slide?.dataset?.layout || `slide-${index + 1}`;

  async function inlineLocalScriptsForHtmlExport(clone){
    const scripts = [...clone.querySelectorAll('script[src^="assets/"]')];
    await Promise.all(scripts.map(async script => {
      const src = script.getAttribute('src');
      try {
        const response = await fetch(src);
        if(!response.ok) return;
        script.textContent = (await response.text()).replace(/<\/script/gi, '<\\/script');
